name: Publish Reconstructed Site

'on':
  push:
    branches:
      - gh-pages
    paths:
      - .github/workflows/publish-site.yml
      - hexo/_config.yml
      - hexo/package.json
      - hexo/themes/**
      - hexo/tools/**
      - hexo/source/**
  workflow_dispatch: {}

concurrency:
  group: publish-reconstructed-site
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Hexo dependencies
        working-directory: hexo
        run: npm install --no-fund --no-audit

      - name: Rebuild and sync published output
        working-directory: hexo
        run: npm run publish-root

      - name: Commit and push generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A .
          git diff --cached --quiet && exit 0
          git commit -m "build: publish reconstructed site [skip ci]"
          git pull --rebase origin gh-pages
          git push origin gh-pages