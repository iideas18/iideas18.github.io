const LANG_COLORS={JavaScript:'#f1e05a',TypeScript:'#3178c6',Python:'#3572A5',Java:'#b07219','C++':'#f34b7d',C:'#555555','C#':'#178600',Go:'#00ADD8',Rust:'#dea584',Shell:'#89e051',HTML:'#e34c26',CSS:'#563d7c',Vue:'#41b883',Ruby:'#701516',PHP:'#4F5D95',Kotlin:'#A97BFF',Swift:'#F05138'};
function langColor(l){return LANG_COLORS[l]||'#ccc'}
let currentData=[],activeLang='',currentPeriod='daily';
function _ssGet(key){try{const v=sessionStorage.getItem(key);return v?JSON.parse(v):null;}catch(e){return null;}}
function _ssSet(key,val){try{sessionStorage.setItem(key,JSON.stringify(val));}catch(e){}}
async function init(){
  try{
    let idx=_ssGet('tr_index');
    if(!idx){
      const r=await fetch('/trending/data/index.json');
      if(!r.ok)throw new Error('no index');
      idx=await r.json();
      _ssSet('tr_index',idx);
    }
    const sel=document.getElementById('tr-date-select');
    idx.dates.sort((a,b)=>b.localeCompare(a));
    idx.dates.forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=d;sel.appendChild(o)});
    document.getElementById('tr-record-count').textContent=idx.dates.length;
    if(idx.dates.length)loadDate(idx.dates[0]);
  }catch(e){
    document.getElementById('tr-list').innerHTML='<div class="tr-empty">No snapshots yet — the daily job will run at 08:00 CST and populate data here.</div>';
    document.getElementById('tr-record-count').textContent='0';
  }
}
function setPeriod(btn,period){
  currentPeriod=period;
  document.querySelectorAll('.tr-period-btn').forEach(b=>b.classList.toggle('active',b===btn));
  const d=document.getElementById('tr-date-select').value;
  if(d)loadDate(d);
}
async function loadDate(date){
  if(!date)return;
  document.getElementById('tr-date-select').value=date;
  const cacheKey=`tr_data_${date}_${currentPeriod}`;
  const cached=_ssGet(cacheKey);
  if(cached){currentData=cached.repos;renderLangFilter(cached.repos);renderList(cached.repos);return;}
  document.getElementById('tr-list').innerHTML='<div class="tr-loading"><i class="fas fa-spinner fa-spin"></i>&nbsp;Loading…</div>';
  try{
    const r=await fetch(`/trending/data/${date}-${currentPeriod}.json`);
    if(!r.ok)throw new Error('missing');
    const data=await r.json();
    _ssSet(cacheKey,data);
    currentData=data.repos;
    renderLangFilter(data.repos);
    renderList(data.repos);
  }catch(e){
    document.getElementById('tr-list').innerHTML=`<div class="tr-empty">No ${currentPeriod} snapshot for ${date}.</div>`;
  }
}
function renderLangFilter(repos){
  const cnt={};repos.forEach(r=>{if(r.language)cnt[r.language]=(cnt[r.language]||0)+1});
  const sorted=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,10);
  document.getElementById('tr-lang-filter').innerHTML=
    '<button class="tr-lang-btn active" onclick="setLang(this,\'\')">All</button>'+
    sorted.map(([l])=>`<button class="tr-lang-btn" onclick="setLang(this,'${l}')" style="border-color:${langColor(l)}">${l}</button>`).join('');
}
function setLang(btn,lang){activeLang=lang;document.querySelectorAll('.tr-lang-btn').forEach(b=>b.classList.toggle('active',b===btn));renderList(currentData)}
function renderList(repos){
  const filtered=activeLang?repos.filter(r=>r.language===activeLang):repos;
  if(!filtered.length){document.getElementById('tr-list').innerHTML='<div class="tr-empty">No repos for this filter.</div>';return}
  document.getElementById('tr-list').innerHTML=filtered.map((r,i)=>`
    <div class="tr-card">
      <div class="tr-rank ${i<3?'top3':''}">${i+1}</div>
      <div class="tr-body">
        <p class="tr-name"><a href="${r.url}" target="_blank" rel="noopener">${r.author} / <strong>${r.name}</strong></a></p>
        <p class="tr-desc">${r.description||'<em style="color:#ccc">No description</em>'}</p>
        <div class="tr-meta">
          ${r.language?`<span class="tr-lang"><span class="lang-dot" style="background:${langColor(r.language)}"></span>${r.language}</span>`:''}
          <span class="tr-stars"><i class="fas fa-star" style="font-size:.8rem"></i>&nbsp;${(r.stars||0).toLocaleString()}</span>
          <span class="tr-forks"><i class="fas fa-code-branch" style="font-size:.8rem;opacity:.5"></i>&nbsp;${(r.forks||0).toLocaleString()}</span>
          ${(r.stars_today||r.gained)?`<span class="tr-gained"><i class="fas fa-arrow-up" style="font-size:.7rem"></i> ${r.stars_today||r.gained} today</span>`:''}
        </div>
      </div>
    </div>`).join('');
}
init();

    GLOBAL_CONFIG_SITE.isPost && panguFn()
