ss="line">1675</span><br><span class="line">1676</span><br><span class="line">1677</span><br><span class="line">1678</span><br><span class="line">1679</span><br><span class="line">1680</span><br><span class="line">1681</span><br><span class="line">1682</span><br><span class="line">1683</span><br><span class="line">1684</span><br><span class="line">1685</span><br></pre></td><td class="code"><pre><span class="line"></span><br><span class="line"><span class="comment">/**</span></span><br><span class="line"><span class="comment"> * Manager running on every node (driver and executors) which provides interfaces for putting and</span></span><br><span class="line"><span class="comment"> * retrieving blocks both locally and remotely into various stores (memory, disk, and off-heap).</span></span><br><span class="line"><span class="comment"> *</span></span><br><span class="line"><span class="comment"> * Note that [[initialize()]] must be called before the BlockManager is usable.</span></span><br><span class="line"><span class="comment"> */</span></span><br><span class="line"><span class="keyword">private</span>[spark] <span class="class"><span class="keyword">class</span> <span class="title">BlockManager</span>(<span class="params"></span></span></span><br><span class="line"><span class="params"><span class="class">    executorId: <span class="type">String</span>,</span></span></span><br><span class="line"><span class="params"><span class="class">    rpcEnv: <span class="type">RpcEnv</span>,</span></span></span><br><span class="line"><span class="params"><span class="class">    val master: <span class="type">BlockManagerMaster</span>,</span></span></span><br><span class="line"><span class="params"><span class="class">    val serializerManager: <span class="type">SerializerManager</span>,</span></span></span><br><span class="line"><span class="params"><span class="class">    val conf: <span class="type">SparkConf</span>,</span></span></span><br><span class="line"><span class="params"><span class="class">    memoryManager: <span class="type">MemoryManager</span>,</span></span></span><br><span class="line"><span class="params"><span class="class">    mapOutputTracker: <span class="type">MapOutputTracker</span>,</span></span></span><br><span class="line"><span class="params"><span class="class">    shuffleManager: <span class="type">ShuffleManager</span>,</span></span></span><br><span class="line"><span class="params"><span class="class">    val blockTransferService: <span class="type">BlockTransferService</span>,</span></span></span><br><span class="line"><span class="params"><span class="class">    securityManager: <span class="type">SecurityManager</span>,</span></span></span><br><span class="line"><span class="params"><span class="class">    externalBlockStoreClient: <span class="type">Option</span>[<span class="type">ExternalBlockStoreClient</span>]</span>)</span></span><br><span class="line">  <span class="keyword">extends</span> <span class="type">BlockDataManager</span> <span class="keyword">with</span> <span class="type">BlockEvictionHandler</span> <span class="keyword">with</span> <span class="type">Logging</span> &#123;</span><br><span class="line"></span><br><span class="line">  <span class="comment">// same as `conf.get(config.SHUFFLE_SERVICE_ENABLED)`</span></span><br><span class="line">  <span class="keyword">private</span>[spark] <span class="keyword">val</span> externalShuffleServiceEnabled: <span class="type">Boolean</span> = externalBlockStoreClient.isDefined</span><br><span class="line"></span><br><span class="line">  <span class="keyword">private</span> <span class="keyword">val</span> remoteReadNioBufferConversion =</span><br><span class="line">    conf.get(<span class="type">Network</span>.<span class="type">NETWORK_REMOTE_READ_NIO_BUFFER_CONVERSION</span>)</span><br><span class="line"></span><br><span class="line">  <span class="keyword">private</span>[spark] <span class="keyword">val</span> subDirsPerLocalDir = conf.get(config.<span class="type">DISKSTORE_SUB_DIRECTORIES</span>)</span><br><span class="line"></span><br><span class="line">  <span class="keyword">val</span> diskBlockManager = &#123;</span><br><span class="line">    <span class="comment">// Only perform cleanup if an external service is not serving our shuffle files.</span></span><br><span class="line">    <span class="keyword">val</span> deleteFilesOnStop =</span><br><span class="line">      !externalShuffleServiceEnabled || executorId == <span class="type">SparkContext</span>.<span class="type">DRIVER_IDENTIFIER</span></span><br><span class="line">    <span class="keyword">new</span> <span class="type">DiskBlockManager</span>(conf, deleteFilesOnStop)</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">// Visible for testing</span></span><br><span class="line">  <span class="keyword">private</span>[storage] <span class="keyword">val</span> blockInfoManager = <span class="keyword">new</span> <span class="type">BlockInfoManager</span></span><br><span class="line"></span><br><span class="line">  <span class="keyword">private</span> <span class="keyword">val</span> futureExecutionContext = <span class="type">ExecutionContext</span>.fromExecutorService(</span><br><span class="line">    <span class="type">ThreadUtils</span>.newDaemonCachedThreadPool(<span class="string">&quot;block-manager-future&quot;</span>, <span class="number">128</span>))</span><br><span class="line"></span><br><span class="line">  <span class="comment">// Actual storage of where blocks are kept</span></span><br><span class="line">  <span class="keyword">private</span>[spark] <span class="keyword">val</span> memoryStore =</span><br><span class="line">    <span class="keyword">new</span> <span class="type">MemoryStore</span>(conf, blockInfoManager, serializerManager, memoryManager, <span class="keyword">this</span>)</span><br><span class="line">  <span class="keyword">private</span>[spark] <span class="keyword">val</span> diskStore = <span class="keyword">new</span> <span class="type">DiskStore</span>(conf, diskBlockManager, securityManager)</span><br><span class="line">  memoryManager.setMemoryStore(memoryStore)</span><br><span class="line"></span><br><span class="line">  <span class="comment">// Note: depending on the memory manager, `maxMemory` may actually vary over time.</span></span><br><span class="line">  <span class="comment">// However, since we use this only for reporting and logging, what we actually want here is</span></span><br><span class="line">  <span class="comment">// the absolute maximum value that `maxMemory` can ever possibly reach. We may need</span></span><br><span class="line">  <span class="comment">// to revisit whether reporting this value as the &quot;max&quot; is intuitive to the user.</span></span><br><span class="line">  <span class="keyword">private</span> <span class="keyword">val</span> maxOnHeapMemory = memoryManager.maxOnHeapStorageMemory</span><br><span class="line">  <span class="keyword">private</span> <span class="keyword">val</span> maxOffHeapMemory = memoryManager.maxOffHeapStorageMemory</span><br><span class="line"></span><br><span class="line">  <span class="keyword">private</span> <span class="keyword">val</span> externalShuffleServicePort = <span class="type">StorageUtils</span>.externalShuffleServicePort(conf)</span><br><span class="line"></span><br><span class="line">  <span class="keyword">var</span> blockManagerId: <span class="type">BlockManagerId</span> = _</span><br><span class="line"></span><br><span class="line">  <span class="comment">// Address of the server that serves this executor&#x27;s shuffle files. This is either an external</span></span><br><span class="line">  <span class="comment">// service, or just our own Executor&#x27;s BlockManager.</span></span><br><span class="line">  <span class="keyword">private</span>[spark] <span class="keyword">var</span> shuffleServerId: <span class="type">BlockManagerId</span> = _</span><br><span class="line"></span><br><span class="line">  <span class="comment">// Client to read other executors&#x27; blocks. This is either an external service, or just the</span></span><br><span class="line">  <span class="comment">// standard BlockTransferService to directly connect to other Executors.</span></span><br><span class="line">  <span class="keyword">private</span>[spark] <span class="keyword">val</span> blockStoreClient = externalBlockStoreClient.getOrElse(blockTransferService)</span><br><span class="line"></span><br><span class="line">  <span class="comment">// Max number of failures before this block manager refreshes the block locations from the driver</span></span><br><span class="line">  <span class="keyword">private</span> <span class="keyword">val</span> maxFailuresBeforeLocationRefresh =</span><br><span class="line">    conf.get(config.<span class="type">BLOCK_FAILURES_BEFORE_LOCATION_REFRESH</span>)</span><br><span class="line"></span><br><span class="line">  <span class="keyword">private</span> <span class="keyword">val</span> slaveEndpoint = rpcEnv.setupEndpoint(</span><br><span class="line">    <span class="string">&quot;BlockManagerEndpoint&quot;</span> + <span class="type">BlockManager</span>.<span class="type">ID_GENERATOR</span>.next,</span><br><span class="line">    <span class="keyword">new</span> <span class="type">BlockManagerSlaveEndpoint</span>(rpcEnv, <span class="keyword">this</span>, mapOutputTracker))</span><br><span class="line"></span><br><span class="line">  <span class="comment">// Pending re-registration action being executed asynchronously or null if none is pending.</span></span><br><span class="line">  <span class="comment">// Accesses should synchronize on asyncReregisterLock.</span></span><br><span class="line">  <span class="keyword">private</span> <span class="keyword">var</span> asyncReregisterTask: <span class="type">Future</span>[<span class="type">Unit</span>] = <span class="literal">null</span></span><br><span class="line">  <span class="keyword">private</span> <span class="keyword">val</span> asyncReregisterLock = <span class="keyword">new</span> <span class="type">Object</span></span><br><span class="line"></span><br><span class="line">  <span class="comment">// Field related to peer block managers that are necessary for block replication</span></span><br><span class="line">  <span class="meta">@volatile</span> <span class="keyword">private</span> <span class="keyword">var</span> cachedPeers: <span class="type">Seq</span>[<span class="type">BlockManagerId</span>] = _</span><br><span class="line">  <span class="keyword">private</span> <span class="keyword">val</span> peerFetchLock = <span class="keyword">new</span> <span class="type">Object</span></span><br><span class="line">  <span class="keyword">private</span> <span class="keyword">var</span> lastPeerFetchTimeNs = <span class="number">0</span>L</span><br><span class="line"></span><br><span class="line">  <span class="keyword">private</span> <span class="keyword">var</span> blockReplicationPolicy: <span class="type">BlockReplicationPolicy</span> = _</span><br><span class="line"></span><br><span class="line">  <span class="comment">// A DownloadFileManager used to track all the files of remote blocks which are above the</span></span><br><span class="line">  <span class="comment">// specified memory threshold. Files will be deleted automatically based on weak reference.</span></span><br><span class="line">  <span class="comment">// Exposed for test</span></span><br><span class="line">  <span class="keyword">private</span>[storage] <span class="keyword">val</span> remoteBlockTempFileManager =</span><br><span class="line">    <span class="keyword">new</span> <span class="type">BlockManager</span>.<span class="type">RemoteBlockDownloadFileManager</span>(<span class="keyword">this</span>)</span><br><span class="line">  <span class="keyword">private</span> <span class="keyword">val</span> maxRemoteBlockToMem = conf.get(config.<span class="type">MAX_REMOTE_BLOCK_SIZE_FETCH_TO_MEM</span>)</span><br><span class="line"></span><br><span class="line">  <span class="keyword">var</span> hostLocalDirManager: <span class="type">Option</span>[<span class="type">HostLocalDirManager</span>] = <span class="type">None</span></span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * Abstraction for storing blocks from bytes, whether they start in memory or on disk.</span></span><br><span class="line"><span class="comment">   *</span></span><br><span class="line"><span class="comment">   * @param blockSize the decrypted size of the block</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="keyword">private</span>[spark] <span class="keyword">abstract</span> <span class="class"><span class="keyword">class</span> <span class="title">BlockStoreUpdater</span>[<span class="type">T</span>](<span class="params"></span></span></span><br><span class="line"><span class="params"><span class="class">      blockSize: <span class="type">Long</span>,</span></span></span><br><span class="line"><span class="params"><span class="class">      blockId: <span class="type">BlockId</span>,</span></span></span><br><span class="line"><span class="params"><span class="class">      level: <span class="type">StorageLevel</span>,</span></span></span><br><span class="line"><span class="params"><span class="class">      classTag: <span class="type">ClassTag</span>[<span class="type">T</span>],</span></span></span><br><span class="line"><span class="params"><span class="class">      tellMaster: <span class="type">Boolean</span>,</span></span></span><br><span class="line"><span class="params"><span class="class">      keepReadLock: <span class="type">Boolean</span></span>) </span>&#123;</span><br><span class="line"></span><br><span class="line">    <span class="comment">/**</span></span><br><span class="line"><span class="comment">     *  Reads the block content into the memory. If the update of the block store is based on a</span></span><br><span class="line"><span class="comment">     *  temporary file this could lead to loading the whole file into a ChunkedByteBuffer.</span></span><br><span class="line"><span class="comment">     */</span></span><br><span class="line">    <span class="keyword">protected</span> <span class="function"><span class="keyword">def</span> <span class="title">readToByteBuffer</span></span>(): <span class="type">ChunkedByteBuffer</span></span><br><span class="line"></span><br><span class="line">    <span class="keyword">protected</span> <span class="function"><span class="keyword">def</span> <span class="title">blockData</span></span>(): <span class="type">BlockData</span></span><br><span class="line"></span><br><span class="line">    <span class="keyword">protected</span> <span class="function"><span class="keyword">def</span> <span class="title">saveToDiskStore</span></span>(): <span class="type">Unit</span></span><br><span class="line"></span><br><span class="line">    <span class="keyword">private</span> <span class="function"><span class="keyword">def</span> <span class="title">saveDeserializedValuesToMemoryStore</span></span>(inputStream: <span class="type">InputStream</span>): <span class="type">Boolean</span> = &#123;</span><br><span class="line">      <span class="keyword">try</span> &#123;</span><br><span class="line">        <span class="keyword">val</span> values = serializerManager.dataDeserializeStream(blockId, inputStream)(classTag)</span><br><span class="line">        memoryStore.putIteratorAsValues(blockId, values, classTag) <span class="keyword">match</span> &#123;</span><br><span class="line">          <span class="keyword">case</span> <span class="type">Right</span>(_) =&gt; <span class="literal">true</span></span><br><span class="line">          <span class="keyword">case</span> <span class="type">Left</span>(iter) =&gt;</span><br><span class="line">            <span class="comment">// If putting deserialized values in memory failed, we will put the bytes directly</span></span><br><span class="line">            <span class="comment">// to disk, so we don&#x27;t need this iterator and can close it to free resources</span></span><br><span class="line">            <span class="comment">// earlier.</span></span><br><span class="line">            iter.close()</span><br><span class="line">            <span class="literal">false</span></span><br><span class="line">        &#125;</span><br><span class="line">      &#125; <span class="keyword">finally</span> &#123;</span><br><span class="line">        <span class="type">IOUtils</span>.closeQuietly(inputStream)</span><br><span class="line">      &#125;</span><br><span class="line">    &#125;</span><br><span class="line"></span><br><span class="line">    <span class="keyword">private</span> <span class="function"><span class="keyword">def</span> <span class="title">saveSerializedValuesToMemoryStore</span></span>(bytes: <span class="type">ChunkedByteBuffer</span>): <span class="type">Boolean</span> = &#123;</span><br><span class="line">      <span class="keyword">val</span> memoryMode = level.memoryMode</span><br><span class="line">      memoryStore.putBytes(blockId, blockSize, memoryMode, () =&gt; &#123;</span><br><span class="line">        <span class="keyword">if</span> (memoryMode == <span class="type">MemoryMode</span>.<span class="type">OFF_HEAP</span> &amp;&amp; bytes.chunks.exists(!_.isDirect)) &#123;</span><br><span class="line">          bytes.copy(<span class="type">Platform</span>.allocateDirectBuffer)</span><br><span class="line">        &#125; <span class="keyword">else</span> &#123;</span><br><span class="line">          bytes</span><br><span class="line">        &#125;</span><br><span class="line">      &#125;)</span><br><span class="line">    &#125;</span><br><span class="line"></span><br><span class="line">    <span class="comment">/**</span></span><br><span class="line"><span class="comment">     * Put the given data according to the given level in one of the block stores, replicating</span></span><br><span class="line"><span class="comment">     * the values if necessary.</span></span><br><span class="line"><span class="comment">     *</span></span><br><span class="line"><span class="comment">     * If the block already exists, this method will not overwrite it.</span></span><br><span class="line"><span class="comment">     *</span></span><br><span class="line"><span class="comment">     * If keepReadLock is true, this method will hold the read lock when it returns (even if the</span></span><br><span class="line"><span class="comment">     * block already exists). If false, this method will hold no locks when it returns.</span></span><br><span class="line"><span class="comment">     *</span></span><br><span class="line"><span class="comment">     * @return true if the block was already present or if the put succeeded, false otherwise.</span></span><br><span class="line"><span class="comment">     */</span></span><br><span class="line">     <span class="function"><span class="keyword">def</span> <span class="title">save</span></span>(): <span class="type">Boolean</span> = &#123;</span><br><span class="line">      doPut(blockId, level, classTag, tellMaster, keepReadLock) &#123; info =&gt;</span><br><span class="line">        <span class="keyword">val</span> startTimeNs = <span class="type">System</span>.nanoTime()</span><br><span class="line"></span><br><span class="line">        <span class="comment">// Since we&#x27;re storing bytes, initiate the replication before storing them locally.</span></span><br><span class="line">        <span class="comment">// This is faster as data is already serialized and ready to send.</span></span><br><span class="line">        <span class="keyword">val</span> replicationFuture = <span class="keyword">if</span> (level.replication &gt; <span class="number">1</span>) &#123;</span><br><span class="line">          <span class="type">Future</span> &#123;</span><br><span class="line">            <span class="comment">// This is a blocking action and should run in futureExecutionContext which is a cached</span></span><br><span class="line">            <span class="comment">// thread pool.</span></span><br><span class="line">            replicate(blockId, blockData(), level, classTag)</span><br><span class="line">          &#125;(futureExecutionContext)</span><br><span class="line">        &#125; <span class="keyword">else</span> &#123;</span><br><span class="line">          <span class="literal">null</span></span><br><span class="line">        &#125;</span><br><span class="line">        <span class="keyword">if</span> (level.useMemory) &#123;</span><br><span class="line">          <span class="comment">// Put it in memory first, even if it also has useDisk set to true;</span></span><br><span class="line">          <span class="comment">// We will drop it to disk later if the memory store can&#x27;t hold it.</span></span><br><span class="line">          <span class="keyword">val</span> putSucceeded = <span class="keyword">if</span> (level.deserialized) &#123;</span><br><span class="line">            saveDeserializedValuesToMemoryStore(blockData().toInputStream())</span><br><span class="line">          &#125; <span class="keyword">else</span> &#123;</span><br><span class="line">            saveSerializedValuesToMemoryStore(readToByteBuffer())</span><br><span class="line">          &#125;</span><br><span class="line">          <span class="keyword">if</span> (!putSucceeded &amp;&amp; level.useDisk) &#123;</span><br><span class="line">            logWarning(<span class="string">s&quot;Persisting block <span class="subst">$blockId</span> to disk instead.&quot;</span>)</span><br><span class="line">            saveToDiskStore()</span><br><span class="line">          &#125;</span><br><span class="line">        &#125; <span class="keyword">else</span> <span class="keyword">if</span> (level.useDisk) &#123;</span><br><span class="line">          saveToDiskStore()</span><br><span class="line">        &#125;</span><br><span class="line">        <span class="keyword">val</span> putBlockStatus = getCurrentBlockStatus(blockId, info)</span><br><span class="line">        <span class="keyword">val</span> blockWasSuccessfullyStored = putBlockStatus.storageLevel.isValid</span><br><span class="line">        <span class="keyword">if</span> (blockWasSuccessfullyStored) &#123;</span><br><span class="line">          <span class="comment">// Now that the block is in either the memory or disk store,</span></span><br><span class="line">          <span class="comment">// tell the master about it.</span></span><br><span class="line">          info.size = blockSize</span><br><span class="line">          <span class="keyword">if</span> (tellMaster &amp;&amp; info.tellMaster) &#123;</span><br><span class="line">            reportBlockStatus(blockId, putBlockStatus)</span><br><span class="line">          &#125;</span><br><span class="line">          addUpdatedBlockStatusToTaskMetrics(blockId, putBlockStatus)</span><br><span class="line">        &#125;</span><br><span class="line">        logDebug(<span class="string">s&quot;Put block <span class="subst">$&#123;blockId&#125;</span> locally took <span class="subst">$&#123;Utils.getUsedTimeNs(startTimeNs)&#125;</span>&quot;</span>)</span><br><span class="line">        <span class="keyword">if</span> (level.replication &gt; <span class="number">1</span>) &#123;</span><br><span class="line">          <span class="comment">// Wait for asynchronous replication to finish</span></span><br><span class="line">          <span class="keyword">try</span> &#123;</span><br><span class="line">            <span class="type">ThreadUtils</span>.awaitReady(replicationFuture, <span class="type">Duration</span>.<span class="type">Inf</span>)</span><br><span class="line">          &#125; <span class="keyword">catch</span> &#123;</span><br><span class="line">            <span class="keyword">case</span> <span class="type">NonFatal</span>(t) =&gt;</span><br><span class="line">              <span class="keyword">throw</span> <span class="keyword">new</span> <span class="type">Exception</span>(<span class="string">&quot;Error occurred while waiting for replication to finish&quot;</span>, t)</span><br><span class="line">          &#125;</span><br><span class="line">        &#125;</span><br><span class="line">        <span class="keyword">if</span> (blockWasSuccessfullyStored) &#123;</span><br><span class="line">          <span class="type">None</span></span><br><span class="line">        &#125; <span class="keyword">else</span> &#123;</span><br><span class="line">          <span class="type">Some</span>(blockSize)</span><br><span class="line">        &#125;</span><br><span class="line">      &#125;.isEmpty</span><br><span class="line">    &#125;</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * Helper for storing a block from bytes already in memory.</span></span><br><span class="line"><span class="comment">   * &#x27;&#x27;&#x27;Important!&#x27;&#x27;&#x27; Callers must not mutate or release the data buffer underlying `bytes`. Doing</span></span><br><span class="line"><span class="comment">   * so may corrupt or change the data stored by the `BlockManager`.</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="keyword">private</span> <span class="keyword">case</span> <span class="class"><span class="keyword">class</span> <span class="title">ByteBufferBlockStoreUpdater</span>[<span class="type">T</span>](<span class="params"></span></span></span><br><span class="line"><span class="params"><s ass="literal">false</span>)</span><br><span class="line"></span><br><span class="line">    <span class="keyword">override</span> <span class="function"><span class="keyword">def</span> <span class="title">saveToDiskStore</span></span>(): <span class="type">Unit</span> = diskStore.putBytes(blockId, bytes)</span><br><span class="line"></span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * Helper for storing a block based from bytes already in a local temp file.</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="keyword">private</span>[spark] <span class="keyword">case</span> <span class="class"><span class="keyword">class</span> <span class="title">TempFileBasedBlockStoreUpdater</span>[<span class="type">T</span>](<span class="params"></span></span></span><br><span class="line"><span class="params"><span class="class">      blockId: <span class="type">BlockId</span>,</span></span></span><br><span class="line"><span class="params"><span class="class">      level: <span class="type">StorageLevel</span>,</span></span></span><br><span class="line"><span class="params"><span class="class">      classTag: <span class="type">ClassTag</span>[<span class="type">T</span>],</span></span></span><br><span class="line"><span class="params"><span class="class">      tmpFile: <span class="type">File</span>,</span></span></span><br><span class="line"><span class="params"><span class="class">      blockSize: <span class="type">Long</span>,</span></span></span><br><span class="line"><span class="params"><span class="class">      tellMaster: <span class="type">Boolean</span> = true,</span></span></span><br><span class="line"><span class="params"><span class="class">      keepReadLock: <span class="type">Boolean</span> = false</span>)</span></span><br><span class="line">    <span class="keyword">extends</span> <span class="type">BlockStoreUpdater</span>[<span class="type">T</span>](blockSize, blockId, level, classTag, tellMaster, keepReadLock) &#123;</span><br><span class="line"></span><br><span class="line">    <span class="keyword">override</span> <span class="function"><span class="keyword">def</span> <span class="title">readToByteBuffer</span></span>(): <span class="type">ChunkedByteBuffer</span> = &#123;</span><br><span class="line">      <span class="keyword">val</span> allocator = level.memoryMode <span class="keyword">match</span> &#123;</span><br><span class="line">        <span class="keyword">case</span> <span class="type">MemoryMode</span>.<span class="type">ON_HEAP</span> =&gt; <span class="type">ByteBuffer</span>.allocate _</span><br><span class="line">        <span class="keyword">case</span> <span class="type">MemoryMode</span>.<span class="type">OFF_HEAP</span> =&gt; <span class="type">Platform</span>.allocateDirectBuffer _</span><br><span class="line">      &#125;</span><br><span class="line">      blockData().toChunkedByteBuffer(allocator)</span><br><span class="line">    &#125;</span><br><span class="line"></span><br><span class="line">    <span class="keyword">override</span> <span class="function"><span class="keyword">def</span> <span class="title">blockData</span></span>(): <span class="type">BlockData</span> = diskStore.getBytes(tmpFile, blockSize)</span><br><span class="line"></span><br><span class="line">    <span class="keyword">override</span> <span class="function"><span class="keyword">def</span> <span class="title">saveToDiskStore</span></span>(): <span class="type">Unit</span> = diskStore.moveFileToBlock(tmpFile, blockSize, blockId)</span><br><span class="line"></span><br><span class="line">    <span class="keyword">override</span> <span class="function"><span class="keyword">def</span> <span class="title">save</span></span>(): <span class="type">Boolean</span> = &#123;</span><br><span class="line">      <span class="keyword">val</span> res = <span class="keyword">super</span>.save()</span><br><span class="line">      tmpFile.delete()</span><br><span class="line">      res</span><br><span class="line">    &#125;</span><br><span class="line"></span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * Initializes the BlockManager with the given appId. This is not performed in the constructor as</span></span><br><span class="line"><span class="comment">   * the appId may not be known at BlockManager instantiation time (in particular for the driver,</span></span><br><span class="line"><span class="comment">   * where it is only learned after registration with the TaskScheduler).</span></span><br><span class="line"><span class="comment">   *</span></span><br><span class="line"><span class="comment">   * This method initializes the BlockTransferService and BlockStoreClient, registers with the</span></span><br><span class="line"><span class="comment">   * BlockManagerMaster, starts the BlockManagerWorker endpoint, and registers with a local shuffle</span></span><br><span class="line"><span class="comment">   * service if configured.</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="function"><span class="keyword">def</span> <span class="title">initialize</span></span>(appId: <span class="type">String</span>): <span class="type">Unit</span> = &#123;</span><br><span class="line">    blockTransferService.init(<span class="keyword">this</span>)</span><br><span class="line">    externalBlockStoreClient.foreach &#123; blockStoreClient =&gt;</span><br><span class="line">      blockStoreClient.init(appId)</span><br><span class="line">    &#125;</span><br><span class="line">    blockReplicationPolicy = &#123;</span><br><span class="line">      <span class="keyword">val</span> priorityClass = conf.get(config.<span class="type">STORAGE_REPLICATION_POLICY</span>)</span><br><span class="line">      <span class="keyword">val</span> clazz = <span class="type">Utils</span>.classForName(priorityClass)</span><br><span class="line">      <span class="keyword">val</span> ret = clazz.getConstructor().newInstance().asInstanceOf[<span class="type">BlockReplicationPolicy</span>]</span><br><span class="line">      logInfo(<span class="string">s&quot;Using <span class="subst">$priorityClass</span> for block replication policy&quot;</span>)</span><br><span class="line">      ret</span><br><span class="line">    &#125;</span><br><span class="line"></span><br><span class="line">    <span class="keyword">val</span> id =</span><br><span class="line">      <span class="type">BlockManagerId</span>(executorId, blockTransferService.hostName, blockTransferService.port, <span class="type">None</span>)</span><br><span class="line"></span><br><span class="line">    <span class="keyword">val</span> idFromMaster = master.registerBlockManager(</span><br><span class="line">      id,</span><br><span class="line">      diskBlockManager.localDirsString,</span><br><span class="line">      maxOnHeapMemory,</span><br><span class="line">      maxOffHeapMemory,</span><br><span class="line">      slaveEndpoint)</span><br><span class="line"></span><br><span class="line">    blockManagerId = <span class="keyword">if</span> (idFromMaster != <span class="literal">null</span>) idFromMaster <span class="keyword">else</span> id</span><br><span class="line"></span><br><span class="line">    shuffleServerId = <span class="keyword">if</span> (externalShuffleServiceEnabled) &#123;</span><br><span class="line">      logInfo(<span class="string">s&quot;external shuffle service port = <span class="subst">$externalShuffleServicePort</span>&quot;</span>)</span><br><span class="line">      <span class="type">BlockManagerId</span>(executorId, blockTransferService.hostName, externalShuffleServicePort)</span><br><span class="line">    &#125; <span class="keyword">else</span> &#123;</span><br><span class="line">      blockManagerId</span><br><span class="line">    &#125;</span><br><span class="line"></span><br><span class="line">    <span class="comment">// Register Executors&#x27; configuration with the local shuffle service, if one should exist.</span></span><br><span class="line">    <span class="keyword">if</span> (externalShuffleServiceEnabled &amp;&amp; !blockManagerId.isDriver) &#123;</span><br><span class="line">      registerWithExternalShuffleServer()</span><br><span class="line">    &#125;</span><br><span class="line"></span><br><span class="line">    hostLocalDirManager =</span><br><span class="line">      <span class="keyword">if</span> (conf.get(config.<span class="type">SHUFFLE_HOST_LOCAL_DISK_READING_ENABLED</span>)) &#123;</span><br><span class="line">        externalBlockStoreClient.map &#123; blockStoreClient =&gt;</span><br><span class="line">          <span class="keyword">new</span> <span class="type">HostLocalDirManager</span>(</span><br><span class="line">            futureExecutionContext,</span><br><span class="line">            conf.get(config.<span class="type">STORAGE_LOCAL_DISK_BY_EXECUTORS_CACHE_SIZE</span>),</span><br><span class="line">            blockStoreClient,</span><br><span class="line">            blockManagerId.host,</span><br><span class="line">            externalShuffleServicePort)</span><br><span class="line">        &#125;</span><br><span class="line">      &#125; <span class="keyword">else</span> &#123;</span><br><span class="line">        <span class="type">None</span></span><br><span class="line">      &#125;</span><br><span class="line"></span><br><span class="line">    logInfo(<span class="string">s&quot;Initialized BlockManager: <span class="subst">$blockManagerId</span>&quot;</span>)</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="function"><span class="keyword">def</span> <span class="title">shuffleMetricsSource</span></span>: <span class="type">Source</span> = &#123;</span><br><span class="line">    <span class="keyword">import</span> <span class="type">BlockManager</span>._</span><br><span class="line"></span><br><span class="line">    <span class="keyword">if</span> (externalShuffleServiceEnabled) &#123;</span><br><span class="line">      <span class="keyword">new</span> <span class="type">ShuffleMetricsSource</span>(<span class="string">&quot;ExternalShuffle&quot;</span>, blockStoreClient.shuffleMetrics())</span><br><span class="line">    &#125; <span class="keyword">else</span> &#123;</span><br><span class="line">      <span class="keyword">new</span> <span class="type">ShuffleMetricsSource</span>(<span class="string">&quot;NettyBlockTransfer&quot;</span>, blockStoreClient.shuffleMetrics())</span><br><span class="line">    &#125;</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="keyword">private</span> <span class="function"><span class="keyword">def</span> <span class="title">registerWithExternalShuffleServer</span></span>(): <span class="type">Unit</span> = &#123;</span><br><span class="line">    logInfo(<span class="string">&quot;Registering executor with local external shuffle service.&quot;</span>)</span><br><span class="line">    <span class="keyword">val</span> shuffleConfig = <span class="keyword">new</span> <span class="type">ExecutorShuffleInfo</span>(</span><br><span class="line">      diskBlockManager.localDirsString,</span><br><span class="line">      diskBlockManager.subDirsPerLocalDir,</span><br><span class="line">      shuffleManager.getClass.getName)</span><br><span class="line"></span><br><span class="line">    <span class="keyword">val</span> <span class="type">MAX_ATTEMPTS</span> = conf.get(config.<span class="type">SHUFFLE_REGISTRATION_MAX_ATTEMPTS</span>)</span><br><span class="line">    <span class="keyword">val</span> <span class="type">SLEEP_TIME_SECS</span> = <span class="number">5</span></span><br><span class="line"></span><br><span class="line">    <span class="keyword">for</span> (i &lt;- <span class="number">1</span> to <span class="type">MAX_ATTEMPTS</span>) &#123;</span><br><span class="line">      <span class="keyword">try</span> &#123;</span><br><span class="line">        <span class="comment">// Synchronous and will throw an exception if we cannot connect.</span></span><br><span class="line">        blockStoreClient.asInstanceOf[<span class="type">ExternalBlockStoreClient</span>].registerWithShuffleServer(</span><br><span class="line">          shuffleServerId.host, shuffleServerId.port, shuffleServerId.executorId, shuffleConfig)</span><br><span class="line">        <span class="keyword">return</span></span><br><span class="line">      &#125; <span class="keyword">catch</span> &#123;</span><br><span class="line">        <span class="keyword">case</span> e: <span class="type">Exception</span> <span class="keyword">if</span> i &lt; <span class="type">MAX_ATTEMPTS</span> =&gt;</span><br><span class="line">          logError(<span class="string">s&quot;Failed to connect to external shuffle server, will retry <span class="subst">$&#123;MAX_ATTEMPTS - i&#125;</span>&quot;</span></span><br><span class="line">            + <span class="string">s&quot; more times after waiting <span class="subst">$SLEEP_TIME_SECS</span> seconds...&quot;</span>, e)</span><br><span class="line">          <span class="type">Thread</span>.sleep(<span class="type">SLEEP_TIME_SECS</span> * <span class="number">1000</span>L)</span><br><span class="line">        <span class="keyword">case</span> <span class="type">NonFatal</span>(e) =&gt;</span><br><span class="line">          <span class="keyword">throw</span> <span class="keyword">new</span> <span class="type">SparkException</span>(<span class="string">&quot;Unable to register with external shuffle server due to : &quot;</span> +</span><br><span class="line">            e.getMessage, e)</span><br><span class="line">      &#125;</span><br><span class="line">    &#125;</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * Report all blocks to the BlockManager again. This may be necessary if we are dropped</span></span><br><span class="line"><span class="comment">   * by the BlockManager and come back or if we become capable of recovering blocks on disk after</span></span><br><span class="line"><span class="comment">   * an executor crash.</span></span><br><span class="line"><span class="comment">   *</span></span><br><span class="line"><span class="comment">   * This function deliberately fails silently if the master returns false (indicating that</span></span><br><span class="line"><span class="comment">   * the slave needs to re-register). The error condition will be detected again by the next</span></span><br><span class="line"><span class="comment">   * heart beat attempt or new block registration and another try to re-register all blocks</span></span><br><span class="line"><span class="comment">   * will be made then.</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="keyword">private</span> <span class="function"><span class="keyword">def</span> <span class="title">reportAllBlocks</span></span>(): <span class="type">Unit</span> = &#123;</span><br><span class="line">    logInfo(<span class="string">s&quot;Reporting <span class="subst">$&#123;blockInfoManager.size&#125;</span> blocks to the master.&quot;</span>)</span><br><span class="line">    <span class="keyword">for</span> ((blockId, info) &lt;- blockInfoManager.entries) &#123;</span><br><span class="line">      <span class="keyword">val</span> status = getCurrentBlockStatus(blockId, info)</span><br><span class="line">      <span class="keyword">if</span> (info.tellMaster &amp;&amp; !tryToReportBlockStatus(blockId, status)) &#123;</span><br><span class="line">        logError(<span class="string">s&quot;Failed to report <span class="subst">$blockId</span> to master; giving up.&quot;</span>)</span><br><span class="line">        <span class="keyword">return</span></span><br><span class="line">      &#125;</span><br><span class="line">    &#125;</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * Re-register with the master and report all blocks to it. This will be called by the heart beat</span></span><br><span class="line"><span class="comment">   * thread if our heartbeat to the block manager indicates that we were not registered.</span></span><br><span class="line"><span class="comment">   *</span></span><br><span class="line"><span class="comment">   * Note that this method must be called without any BlockInfo locks held.</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="function"><span class="keyword">def</span> <span class="title">reregister</span></span>(): <span class="type">Unit</span> = &#123;</span><br><span class="line">    <span class="comment">// <span class="doctag">TODO:</span> We might need to rate limit re-registering.</span></span><br><span class="line">    logInfo(<span class="string">s&quot;BlockManager <span class="subst">$blockManagerId</span> re-registering with master&quot;</span>)</span><br><span class="line">    master.registerBlockManager(blockManagerId, diskBlockManager.localDirsString, maxOnHeapMemory,</span><br><span class="line">      maxOffHeapMemory, slaveEndpoint)</span><br><span class="line">    reportAllBlocks()</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * Re-register with the master sometime soon.</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="keyword">private</span> <span class="function"><span class="keyword">def</span> <span class="title">asyncReregister</span></span>(): <span class="type">Unit</span> = &#123;</span><br><span class="line">    asyncReregisterLock.synchronized &#123;</span><br><span class="line">      <span class="keyword">if</span> (asyncReregisterTask == <span class="literal">null</span>) &#123;</span><br><span class="line">        asyncReregisterTask = <span class="type">Future</span>[<span class="type">Unit</span>] &#123;</span><br><span class="line">          <span class="comment">// This is a blocking action and should run in futureExecutionContext which is a cached</span></span><br><span class="line">          <span class="comment">// thread pool</span></span><br><span class="line">          reregister()</span><br><span class="line">          asyncReregisterLock.synchronized &#123;</span><br><span class="line">            asyncReregisterTask = <span class="literal">null</span></span><br><span class="line">          &#125;</span><br><span class="line">        &#125;(futureExecutionContext)</span><br><span class="line">      &#125;</span><br><span class="line">    &#125;</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * For testing. Wait for any pending asynchronous re-registration; otherwise, do nothing.</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="function"><span class="keyword">def</span> <span class="title">waitForAsyncReregister</span></span>(): <span class="type">Unit</span> = &#123;</span><br><span class="line">    <span class="keyword">val</span> task = asyncReregisterTask</span><br><span class="line">    <span class="keyword">if</span> (task != <span class="literal">null</span>) &#123;</span><br><span class="line">      <span class="keyword">try</span> &#123;</span><br><span class="line">        <span class="type">ThreadUtils</span>.awaitReady(task, <span class="type">Duration</span>.<span class="type">Inf</span>)</span><br><span class="line">      &#125; <span class="keyword">catch</span> &#123;</span><br><span class="line">        <span class="keyword">case</span> <span class="type">NonFatal</span>(t) =&gt;</span><br><span class="line">          <span class="keyword">throw</span> <span class="keyword">new</span> <span class="type">Exception</span>(<span class="string">&quot;Error occurred while waiting for async. reregistration&quot;</span>, t)</span><br><span class="line">      &#125;</span><br><span class="line">    &#125;</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="keyword">override</span> <span class="function"><span class="keyword">def</span> <span class="title">getHostLocalShuffleData</span></span>(</span><br><span class="line">      blockId: <span class="type">BlockId</span>,</span><br><span class="line">      dirs: <span class="type">Array</span>[<span class="type">String</span>]): <span class="type">ManagedBuffer</span> = &#123;</span><br><span class="line">    shuffleManager.shuffleBlockResolver.getBlockData(blockId, <span class="type">Some</span>(dirs))</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * Interface to get local block data. Throws an exception if the block cannot be found or</span></span><br><span class="line"><span class="comment">   * cannot be read successfully.</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="keyword">override</span> <span class="function"><span class="keyword">def</span> <span class="title">getLocalBlockData</span></span>(blockId: <span class="type">BlockId</span>): <span class="type">ManagedBuffer</span> = &#123;</span><br><span class="line">    <span class="keyword">if</span> (blockId.isShuffle) &#123;</span><br><span class="line">      shuffleManager.shuffleBlockResolver.getBlockData(blockId)</span><br><span class="line">    &#125; <span class="keyword">else</span> &#123;</span><br><span class="line">      getLocalBytes(blockId) <span class="keyword">match</span> &#123;</span><br><span class="line">        <span class="keyword">case</span> <span class="type">Some</span>(blockData) =&gt;</span><br><span class="line">          <span class="keyword">new</span> <span class="type">BlockManagerManagedBuffer</span>(blockInfoManager, blockId, blockData, <span class="literal">true</span>)</span><br><span class="line">        <span class="keyword">case</span> <span class="type">None</span> =&gt;</span><br><span class="line">          <span class="comment">// If this block manager receives a request for a block that it doesn&#x27;t have then it&#x27;s</span></span><br><span class="line">          <span class="comment">// likely that the master has outdated block statuses for this block. Therefore, we send</span></span><br><span class="line">          <span class="comment">// an RPC so that this block is marked as being unavailable from this block manager.</span></span><br><span class="line">          reportBlockStatus(blockId, <span class="type">BlockStatus</span>.empty)</span><br><span class="line">          <span class="keyword">throw</span> <span class="keyword">new</span> <span class="type">BlockNotFoundException</span>(blockId.toString)</span><br><span class="line">      &#125;</span><br><span class="line">    &#125;</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * Put the block locally, using the given storage level.</span></span><br><span class="line"><span class="comment">   *</span></span><br><span class="line"><span class="comment">   * &#x27;&#x27;&#x27;Important!&#x27;&#x27;&#x27; Callers must not mutate or release the data buffer underlying `bytes`. Doing</span></span><br><span class="line"><span class="comment">   * so may corrupt or change the data stored by the `BlockManager`.</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="keyword">override</span> <span class="function"><span class="keyword">def</span> <span class="title">putBlockData</span></span>(</span><br><span class="line">      blockId: <span class="type">BlockId</span>,</span><br><span class="line">      data: <span class="type">ManagedBuffer</span>,</span><br><span class="line">      level: <span class="type">StorageLevel</span>,</span><br><span class="line">      classTag: <span class="type">ClassTag</span>[_]): <span class="type">Boolean</span> = &#123;</span><br><span class="line">    putBytes(blockId, <span class="keyword">new</span> <span class="type">ChunkedByteBuffer</span>(data.nioByteBuffer()), level)(classTag)</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="keyword">override</span> <span class="function"><span class="keyword">def</span> <span class="title">putBlockDataAsStream</span></span>(</span><br><span class="line">      blockId: <span class="type">BlockId</span>,</span><br><span class="line">      level: <span class="type">StorageLevel</span>,</span><br><span class="line">      classTag: <span class="type">ClassTag</span>[_]): <span class="type">StreamCallbackWithID</span> = &#123;</span><br><span class="line">    <span class="keyword">val</span> (_, tmpFile) = diskBlockManager.createTempLocalBlock()</span><br><span class="line">    <span class="keyword">val</span> channel = <span class="keyword">new</span> <span class="type">CountingWritableChannel</span>(</span><br><span class="line">      <span class="type">Channels</span>.newChannel(serializerManager.wrapForEncryption(<span class="keyword">new</span> <span class="type">FileOutputStream</span>(tmpFile))))</span><br><span class="line">    logTrace(<span class="string">s&quot;Streaming block <span class="subst">$blockId</span> to tmp file <span class="subst">$tmpFile</span>&quot;</span>)</span><br><span class="line">    <span class="keyword">new</span> <span class="type">StreamCallbackWithID</span> &#123;</span><br><span class="line"></span><br><span class="line">      <span class="keyword">override</span> <span class="function"><span class="keyword">def</span> <span class="title">getID</span></span>: <span class="type">String</span> = blockId.name</span><br><span class="line"></span><br><span class="line">      <span class="keyword">override</span> <span class="function"><span class="keyword">def</span> <span class="title">onData</span></span>(streamId: <span class="type">String</span>, buf: <span class="type">ByteBuffer</span>): <span class="type">Unit</span> = &#123;</span><br><span class="line">        <span class="keyword">while</span> (buf.hasRemaining) &#123;</span><br><span class="line">          channel.write(buf)</span><br><span class="line">        &#125;</span><br><span class="line">      &#125;</span><br><span class="line"></span><br><span class="line">      <span class="keyword">override</span> <span class="function"><span class="keyword">def</span> <span class="title">onComplete</span></span>(streamId: <span class="type">String</span>): <span class="type">Unit</span> = &#123;</span><br><span class="line">        logTrace(<span class="string">s&quot;Done receiving block <span class="subst">$blockId</span>, now putting into local blockManager&quot;</span>)</span><br><span class="line">        <span class="comment">// Note this is all happening inside the netty thread as soon as it reads the end of the</span></span><br><span class="line">        <span class="comment">// stream.</span></span><br><span class="line">        channel.close()</span><br><span class="line">        <span class="keyword">val</span> blockSize = channel.getCount</span><br><span class="line">        <span class="type">TempFileBasedBlockStoreUpdater</span>(blockId, level, classTag, tmpFile, blockSize).save()</span><br><span class="line">      &#125;</span><br><span class="line"></span><br><span class="line">      <span class="keyword">override</span> <span class="function"><span class="keyword">def</span> <span class="title">onFailure</span></span>(streamId: <span class="type">String</span>, cause: <span class="type">Throwable</span>): <span class="type">Unit</span> = &#123;</span><br><span class="line">        <span class="comment">// the framework handles the connection itself, we just need to do local cleanup</span></span><br><span class="line">        channel.close()</span><br><span class="line">        tmpFile.delete()</span><br><span class="line">      &#125;</span><br><span class="line">    &#125;</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * Get the BlockStatus for the block identified by the given ID, if it exists.</span></span><br><span class="line"><span class="comment">   * <span class="doctag">NOTE:</span> This is mainly for testing.</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="function"><span class="keyword">def</span> <span class="title">getStatus</span></span>(blockId: <span class="type">BlockId</span>): <span class="type">Option</span>[<span class="type">BlockStatus</span>] = &#123;</span><br><span class="line">    blockInfoManager.get(blockId).map &#123; info =&gt;</span><br><span class="line">      <span class="keyword">val</span> memSize = <span class="keyword">if</span> (memoryStore.contains(blockId)) memoryStore.getSize(blockId) <span class="keyword">else</span> <span class="number">0</span>L</span><br><span class="line">      <span class="keyword">val</span> diskSize = <span class="keyword">if</span> (diskStore.contains(blockId)) diskStore.getSize(blockId) <span class="keyword">else</span> <span class="number">0</span>L</span><br><span class="line">      <span class="type">BlockStatus</span>(info.level, memSize = memSize, diskSize = diskSize)</span><br><span class="line">    &#125;</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * Get the ids of existing blocks that match the given filter. Note that this will</span></span><br><span class="line"><span class="comment">   * query the blocks stored in the disk block manager (that the block manager</span></span><br><span class="line"><span class="comment">   * may not know of).</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="function"><span class="keyword">def</span> <span class="title">getMatchingBlockIds</span></span>(filter: <span class="type">BlockId</span> =&gt; <span class="type">Boolean</span>): <span class="type">Seq</span>[<span class="type">BlockId</span>] = &#123;</span><br><span class="line">    <span class="comment">// The `toArray` is necessary here in order to force the list to be materialized so that we</span></span><br><span class="line">    <span class="comment">// don&#x27;t try to serialize a lazy iterator when responding to client requests.</span></span><br><span class="line">    (blockInfoManager.entries.map(_._1) ++ diskBlockManager.getAllBlocks())</span><br><span class="line">      .filter(filter)</span><br><span class="line">      .toArray</span><br><span class="line">      .toSeq</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * Tell the master about the current storage status of a block. This will send a block update</span></span><br><span class="line"><span class="comment">   * message reflecting the current status, *not* the desired storage level in its block info.</span></span><br><span class="line"><span class="comment">   * For example, a block with MEMORY_AND_DISK set might have fallen out to be only on disk.</span></span><br><span class="line"><span class="comment">   *</span></span><br><span class="line"><span class="comment">   * droppedMemorySize exists to account for when the block is dropped from memory to disk (so</span></span><br><span class="line"><span class="comment">   * it is still valid). This ensures that update in master will compensate for the increase in</span></span><br><span class="line"><span class="comment">   * memory on slave.</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="keyword">private</span> <span class="function"><span class="keyword">def</span> <span class="title">reportBlockStatus</span></span>(</span><br><span class="line">      blockId: <span class="type">BlockId</span>,</span><br><span class="line">      status: <span class="type">BlockStatus</span>,</span><br><span class="line">      droppedMemorySize: <span class="type">Long</span> = <span class="number">0</span>L): <span class="type">Unit</span> = &#123;</span><br><span class="line">    <span class="keyword">val</span> needReregister = !tryToReportBlockStatus(blockId, status, droppedMemorySize)</span><br><span class="line">    <span class="keyword">if</span> (needReregister) &#123;</span><br><span class="line">      logInfo(<span class="string">s&quot;Got told to re-register updating block <span class="subst">$blockId</span>&quot;</span>)</span><br><span class="line">      <span class="comment">// Re-registering will report our new block for free.</span></span><br><span class="line">      asyncReregister()</span><br><span class="line">    &#125;</span><br><span class="line">    logDebug(<span class="string">s&quot;Told master about block <span class="subst">$blockId</span>&quot;</span>)</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * Actually send a UpdateBlockInfo message. Returns the master&#x27;s response,</span></span><br><span class="line"><span class="comment">   * which will be true if the block was successfully recorded and false if</span></span><br><span class="line"><span class="comment">   * the slave needs to re-register.</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="keyword">private</span> <span class="function"><span class="keyword">def</span> <span class="title">tryToReportBlockStatus</span></span>(</span><br><span class="line">      blockId: <span class="type">BlockId</span>,</span><br><span class="line">      status: <span class="type">BlockStatus</span>,</span><br><span class="line">      droppedMemorySize: <span class="type">Long</span> = <span class="number">0</span>L): <span class="type">Boolean</span> = &#123;</span><br><span class="line">    <span class="keyword">val</span> storageLevel = status.storageLevel</span><br><span class="line">    <span class="keyword">val</span> inMemSize = <span class="type">Math</span>.max(status.memSize, droppedMemorySize)</span><br><span class="line">    <span class="keyword">val</span> onDiskSize = status.diskSize</span><br><span class="line">    master.updateBlockInfo(blockManagerId, blockId, storageLevel, inMemSize, onDiskSize)</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * Return the updated storage status of the block with the given ID. More specifically, if</span></span><br><span class="line"><span class="comment">   * the block is dropped from memory and possibly added to disk, return the new storage level</span></span><br><span class="line"><span class="comment">   * and the updated in-memory and on-disk sizes.</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="keyword">private</span> <span class="function"><span class="keyword">def</span> <span class="title">getCurrentBlockStatus</span></span>(blockId: <span class="type">BlockId</span>, info: <span class="type">BlockInfo</span>): <span class="type">BlockStatus</span> = &#123;</span><br><span class="line">    info.synchronized &#123;</span><br><span class="line">      info.level <span class="keyword">match</span> &#123;</span><br><span class="line">        <span class="keyword">case</span> <span class="literal">null</span> =&gt;</span><br><span class="line">          <span class="type">BlockStatus</span>.empty</span><br><span class="line">        <span class="keyword">case</span> level =&gt;</span><br><span class="line">          <span class="keyword">val</span> inMem = level.useMemory &amp;&amp; memoryStore.contains(blockId)</span><br><span class="line">          <span class="keyword">val</span> onDisk = level.useDisk &amp;&amp; diskStore.contains(blockId)</span><br><span class="line">          <span class="keyword">val</span> deserialized = <span class="keyword">if</span> (inMem) level.deserialized <span class="keyword">else</span> <span class="literal">false</span></span><br><span class="line">          <span class="keyword">val</span> replication = <span class="keyword">if</span> (inMem  || onDisk) level.replication <span class="keyword">else</span> <span class="number">1</span></span><br><span class="line">          <span class="keyword">val</span> storageLevel = <span class="type">StorageLevel</span>(</span><br><span class="line">            useDisk = onDisk,</span><br><span class="line">            useMemory = inMem,</span><br><span class="line">            useOffHeap = level.useOffHeap,</span><br><span class="line">            deserialized = deserialized,</span><br><span class="line">            replication = replication)</span><br><span class="line">          <span class="keyword">val</span> memSize = <span class="keyword">if</span> (inMem) memoryStore.getSize(blockId) <span class="keyword">else</span> <span class="number">0</span>L</span><br><span class="line">          <span class="keyword">val</span> diskSize = <span class="keyword">if</span> (onDisk) diskStore.getSize(blockId) <span class="keyword">else</span> <span class="number">0</span>L</span><br><span class="line">          <span class="type">BlockStatus</span>(storageLevel, memSize, diskSize)</span><br><span class="line">      &#125;</span><br><span class="line">    &#125;</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * Get locations of an array of blocks.</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="keyword">private</span> <span class="function"><span class="keyword">def</span> <span class="title">getLocationBlockIds</span></span>(blockIds: <span class="type">Array</span>[<span class="type">BlockId</span>]): <span class="type">Array</span>[<span class="type">Seq</span>[<span class="type">BlockManagerId</span>]] = &#123;</span><br><span class="line">    <span class="keyword">val</span> startTimeNs = <span class="type">System</span>.nanoTime()</span><br><span class="line">    <span class="keyword">val</span> locations = master.getLocations(blockIds).toArray</span><br><span class="line">    logDebug(<span class="string">s&quot;Got multiple block location in <span class="subst">$&#123;Utils.getUsedTimeNs(startTimeNs)&#125;</span>&quot;</span>)</span><br><span class="line">    locations</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * Cleanup code run in response to a failed local read.</span></span><br><span class="line"><span class="comment">   * Must be called while holding a read lock on the block.</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="keyword">private</span> <span class="function"><span class="keyword">def</span> <span class="title">handleLocalReadFailure</span></span>(blockId: <span class="type">BlockId</span>): <span class="type">Nothing</span> = &#123;</span><br><span class="line">    releaseLock(blockId)</span><br><span class="line">    <span class="comment">// Remove the missing block so that its unavailability is reported to the driver</span></span><br><span class="line">    removeBlock(blockId)</span><br><span class="line">    <span class="keyword">throw</span> <span class="keyword">new</span> <span class="type">SparkException</span>(<span class="string">s&quot;Block <span class="subst">$blockId</span> was not found even though it&#x27;s read-locked&quot;</span>)</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * Get block from local block manager as an iterator of Java objects.</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="function"><span class="keyword">def</span> <span class="title">getLocalValues</span></span>(blockId: <span class="type">BlockId</span>): <span class="type">Option</span>[<span class="type">BlockResult</span>] = &#123;</span><br><span class="line">    logDebug(<span class="string">s&quot;Getting local block <span class="subst">$blockId</span>&quot;</span>)</span><br><span class="line">    blockInfoManager.lockForReading(blockId) <span class="keyword">match</span> &#123;</span><br><span class="line">      <span class="keyword">case</span> <span class="type">None</span> =&gt;</span><br><span class="line">        logDebug(<span class="string">s&quot;Block <span class="subst">$blockId</span> was not found&quot;</span>)</span><br><span class="line">        <span class="type">None</span></span><br><span class="line">      <span class="keyword">case</span> <span class="type">Some</span>(info) =&gt;</span><br><span class="line">        <span class="keyword">val</span> level = info.level</span><br><span class="line">        logDebug(<span class="string">s&quot;Level for block <span class="subst">$blockId</span> is <span class="subst">$level</span>&quot;</span>)</span><br><span class="line">        <span class="keyword">val</span> taskContext = <span class="type">Option</span>(<span class="type">TaskContext</span>.get())</span><br><span class="line">        <span class="keyword">if</span> (level.useMemory &amp;&amp; memoryStore.contains(blockId)) &#123;</span><br><span class="line">          <span class="keyword">val</span> iter: <span class="type">Iterator</span>[<span class="type">Any</span>] = <span class="keyword">if</span> (level.deserialized) &#123;</span><br><span class="line">            memoryStore.getValues(blockId).get</span><br><span class="line">          &#125; <span class="keyword">else</span> &#123;</span><br><span class="line">            serializerManager.dataDeserializeStream(</span><br><span class="line">              blockId, memoryStore.getBytes(blockId).get.toInputStream())(info.classTag)</span><br><span class="line">          &#125;</span><br><span class="line">          <span class="comment">// We need to capture the current taskId in case the iterator completion is triggered</span></span><br><span class="line">          <span class="comment">// from a different thread which does not have TaskContext set; see SPARK-18406 for</sp .getOrElse &#123; diskData.toInputStream() &#125;</span><br><span class="line">              serializerManager.dataDeserializeStream(blockId, stream)(info.classTag)</span><br><span class="line">            &#125;</span><br><span class="line">          &#125;</span><br><span class="line">          <span class="keyword">val</span> ci = <span class="type">CompletionIterator</span>[<span class="type">Any</span>, <span class="type">Iterator</span>[<span class="type">Any</span>]](iterToReturn, &#123;</span><br><span class="line">            releaseLockAndDispose(blockId, diskData, taskContext)</span><br><span class="line">          &#125;)</span><br><span class="line">          <span class="type">Some</span>(<span class="keyword">new</span> <span class="type">BlockResult</span>(ci, <span class="type">DataReadMethod</span>.<span class="type">Disk</span>, info.size))</span><br><span class="line">        &#125; <span class="keyword">else</span> &#123;</span><br><span class="line">          handleLocalReadFailure(blockId)</span><br><span class="line">        &#125;</span><br><span class="line">    &#125;</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * Get block from the local block manager as serialized bytes.</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="function"><span class="keyword">def</span> <span class="title">getLocalBytes</span></span>(blockId: <span class="type">BlockId</span>): <span class="type">Option</span>[<span class="type">BlockData</span>] = &#123;</span><br><span class="line">    logDebug(<span class="string">s&quot;Getting local block <span class="subst">$blockId</span> as bytes&quot;</span>)</span><br><span class="line">    assert(!blockId.isShuffle, <span class="string">s&quot;Unexpected ShuffleBlockId <span class="subst">$blockId</span>&quot;</span>)</span><br><span class="line">    blockInfoManager.lockForReading(blockId).map &#123; info =&gt; doGetLocalBytes(blockId, info) &#125;</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * Get block from the local block manager as serialized bytes.</span></span><br><span class="line"><span class="comment">   *</span></span><br><span class="line"><span class="comment">   * Must be called while holding a read lock on the block.</span></span><br><span class="line"><span class="comment">   * Releases the read lock upon exception; keeps the read lock upon successful return.</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="keyword">private</span> <span class="function"><span class="keyword">def</span> <span class="title">doGetLocalBytes</span></span>(blockId: <span class="type">BlockId</span>, info: <span class="type">BlockInfo</span>): <span class="type">BlockData</span> = &#123;</span><br><span class="line">    <span class="keyword">val</span> level = info.level</span><br><span class="line">    logDebug(<span class="string">s&quot;Level for block <span class="subst">$blockId</span> is <span class="subst">$level</span>&quot;</span>)</span><br><span class="line">    <span class="comment">// In order, try to read the serialized bytes from memory, then from disk, then fall back to</span></span><br><span class="line">    <span class="comment">// serializing in-memory objects, and, finally, throw an exception if the block does not exist.</span></span><br><span class="line">    <span class="keyword">if</span> (level.deserialized) &#123;</span><br><span class="line">      <span class="comment">// Try to avoid expensive serialization by reading a pre-serialized copy from disk:</span></span><br><span class="line">      <span class="keyword">if</span> (level.useDisk &amp;&amp; diskStore.contains(blockId)) &#123;</span><br><span class="line">        <span class="comment">// Note: we purposely do not try to put the block back into memory here. Since this branch</span></span><br><span class="line">        <span class="comment">// handles deserialized blocks, this block may only be cached in memory as objects, not</span></span><br><span class="line">        <span class="comment">// serialized bytes. Because the caller only requested bytes, it doesn&#x27;t make sense to</span></span><br><span class="line">        <span class="comment">// cache the block&#x27;s deserialized objects since that caching may not have a payoff.</span></span><br><span class="line">        diskStore.getBytes(blockId)</span><br><span class="line">      &#125; <span class="keyword">else</span> <span class="keyword">if</span> (level.useMemory &amp;&amp; memoryStore.contains(blockId)) &#123;</span><br><span class="line">        <span class="comment">// The block was not found on disk, so serialize an in-memory copy:</span></span><br><span class="line">        <span class="keyword">new</span> <span class="type">ByteBufferBlockData</span>(serializerManager.dataSerializeWithExplicitClassTag(</span><br><span class="line">          blockId, memoryStore.getValues(blockId).get, info.classTag), <span class="literal">true</span>)</span><br><span class="line">      &#125; <span class="keyword">else</span> &#123;</span><br><span class="line">        handleLocalReadFailure(blockId)</span><br><span class="line">      &#125;</span><br><span class="line">    &#125; <span class="keyword">else</span> &#123;  <span class="comment">// storage level is serialized</span></span><br><span class="line">      <span class="keyword">if</span> (level.useMemory &amp;&amp; memoryStore.contains(blockId)) &#123;</span><br><span class="line">        <span class="keyword">new</span> <span class="type">ByteBufferBlockData</span>(memoryStore.getBytes(blockId).get, <span class="literal">false</span>)</span><br><span class="line">      &#125; <span class="keyword">else</span> <span class="keyword">if</span> (level.useDisk &amp;&amp; diskStore.contains(blockId)) &#123;</span><br><span class="line">        <span class="keyword">val</span> diskData = diskStore.getBytes(blockId)</span><br><span class="line">        maybeCacheDiskBytesInMemory(info, blockId, level, diskData)</span><br><span class="line">          .map(<span class="keyword">new</span> <span class="type">ByteBufferBlockData</span>(_, <span class="literal">false</span>))</span><br><span class="line">          .getOrElse(diskData)</span><br><span class="line">      &#125; <span class="keyword">else</span> &#123;</span><br><span class="line">        handleLocalReadFailure(blockId)</span><br><span class="line">      &#125;</span><br><span class="line">    &#125;</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * Get block from remote block managers.</span></span><br><span class="line"><span class="comment">   *</span></span><br><span class="line"><span class="comment">   * This does not acquire a lock on this block in this JVM.</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="keyword">private</span>[spark] <span class="function"><span class="keyword">def</span> <span class="title">getRemoteValues</span></span>[<span class="type">T</span>: <span class="type">ClassTag</span>](blockId: <span class="type">BlockId</span>): <span class="type">Option</span>[<span class="type">BlockResult</span>] = &#123;</span><br><span class="line">    <span class="keyword">val</span> ct = implicitly[<span class="type">ClassTag</span>[<span class="type">T</span>]]</span><br><span class="line">    getRemoteBlock(blockId, (data: <span class="type">ManagedBuffer</span>) =&gt; &#123;</span><br><span class="line">      <span class="keyword">val</span> values =</span><br><span class="line">        serializerManager.dataDeserializeStream(blockId, data.createInputStream())(ct)</span><br><span class="line">      <span class="keyword">new</span> <span class="type">BlockResult</span>(values, <span class="type">DataReadMethod</span>.<span class="type">Network</span>, data.size)</span><br><span class="line">    &#125;)</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * Get the remote block and transform it to the provided data type.</span></span><br><span class="line"><span class="comment">   *</span></span><br><span class="line"><span class="comment">   * If the block is persisted to the disk and stored at an executor running on the same host then</span></span><br><span class="line"><span class="comment">   * first it is tried to be accessed using the local directories of the other executor directly.</span></span><br><span class="line"><span class="comment">   * If the file is successfully identified then tried to be transformed by the provided</span></span><br><span class="line"><span class="comment">   * transformation function which expected to open the file. If there is any exception during this</span></span><br><span class="line"><span class="comment">   * transformation then block access falls back to fetching it from the remote executor via the</span></span><br><span class="line"><span class="comment">   * network.</span></span><br><span class="line"><span class="comment">   *</span></span><br><span class="line"><span class="comment">   * @param blockId identifies the block to get</span></span><br><span class="line"><span class="comment">   * @param bufferTransformer this transformer expected to open the file if the block is backed by a</span></span><br><span class="line"><span class="comment">   *                          file by this it is guaranteed the whole content can
