ss="keyword">val</span> info = blockInfoManager.assertBlockIsLockedForWriting(blockId)</span><br><span class="line">    <span class="keyword">var</span> blockIsUpdated = <span class="literal">false</span></span><br><span class="line">    <span class="keyword">val</span> level = info.level</span><br><span class="line"></span><br><span class="line">    <span class="comment">// Drop to disk, if storage level requires</span></span><br><span class="line">    <span class="keyword">if</span> (level.useDisk &amp;&amp; !diskStore.contains(blockId)) &#123;</span><br><span class="line">      logInfo(<span class="string">s&quot;Writing block <span class="subst">$blockId</span> to disk&quot;</span>)</span><br><span class="line">      data() <span class="keyword">match</span> &#123;</span><br><span class="line">        <span class="keyword">case</span> <span class="type">Left</span>(elements) =&gt;</span><br><span class="line">          diskStore.put(blockId) &#123; channel =&gt;</span><br><span class="line">            <span class="keyword">val</span> out = <span class="type">Channels</span>.newOutputStream(channel)</span><br><span class="line">            serializerManager.dataSerializeStream(</span><br><span class="line">              blockId,</span><br><span class="line">              out,</span><br><span class="line">              elements.toIterator)(info.classTag.asInstanceOf[<span class="type">ClassTag</span>[<span class="type">T</span>]])</span><br><span class="line">          &#125;</span><br><span class="line">        <span class="keyword">case</span> <span class="type">Right</span>(bytes) =&gt;</span><br><span class="line">          diskStore.putBytes(blockId, bytes)</span><br><span class="line">      &#125;</span><br><span class="line">      blockIsUpdated = <span class="literal">true</span></span><br><span class="line">    &#125;</span><br><span class="line"></span><br><span class="line">    <span class="comment">// Actually drop from memory store</span></span><br><span class="line">    <span class="keyword">val</span> droppedMemorySize =</span><br><span class="line">      <span class="keyword">if</span> (memoryStore.contains(blockId)) memoryStore.getSize(blockId) <span class="keyword">else</span> <span class="number">0</span>L</span><br><span class="line">    <span class="keyword">val</span> blockIsRemoved = memoryStore.remove(blockId)</span><br><span class="line">    <span class="keyword">if</span> (blockIsRemoved) &#123;</span><br><span class="line">      blockIsUpdated = <span class="literal">true</span></span><br><span class="line">    &#125; <span class="keyword">else</span> &#123;</span><br><span class="line">      logWarning(<span class="string">s&quot;Block <span class="subst">$blockId</span> could not be dropped from memory as it does not exist&quot;</span>)</span><br><span class="line">    &#125;</span><br><span class="line"></span><br><span class="line">    <span class="keyword">val</span> status = getCurrentBlockStatus(blockId, info)</span><br><span class="line">    <span class="keyword">if</span> (info.tellMaster) &#123;</span><br><span class="line">      reportBlockStatus(blockId, status, droppedMemorySize)</span><br><span class="line">    &#125;</span><br><span class="line">    <span class="keyword">if</span> (blockIsUpdated) &#123;</span><br><span class="line">      addUpdatedBlockStatusToTaskMetrics(blockId, status)</span><br><span class="line">    &#125;</span><br><span class="line">    status.storageLevel</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * Remove all blocks belonging to the given RDD.</span></span><br><span class="line"><span class="comment">   *</span></span><br><span class="line"><span class="comment">   * @return The number of blocks removed.</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="function"><span class="keyword">def</span> <span class="title">removeRdd</span></span>(rddId: <span class="type">Int</span>): <span class="type">Int</span> = &#123;</span><br><span class="line">    <span class="comment">// <span class="doctag">TODO:</span> Avoid a linear scan by creating another mapping of RDD.id to blocks.</span></span><br><span class="line">    logInfo(<span class="string">s&quot;Removing RDD <span class="subst">$rddId</span>&quot;</span>)</span><br><span class="line">    <span class="keyword">val</span> blocksToRemove = blockInfoManager.entries.flatMap(_._1.asRDDId).filter(_.rddId == rddId)</span><br><span class="line">    blocksToRemove.foreach &#123; blockId =&gt; removeBlock(blockId, tellMaster = <span class="literal">false</span>) &#125;</span><br><span class="line">    blocksToRemove.size</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * Remove all blocks belonging to the given broadcast.</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="function"><span class="keyword">def</span> <span class="title">removeBroadcast</span></span>(broadcastId: <span class="type">Long</span>, tellMaster: <span class="type">Boolean</span>): <span class="type">Int</span> = &#123;</span><br><span class="line">    logDebug(<span class="string">s&quot;Removing broadcast <span class="subst">$broadcastId</span>&quot;</span>)</span><br><span class="line">    <span class="keyword">val</span> blocksToRemove = blockInfoManager.entries.map(_._1).collect &#123;</span><br><span class="line">      <span class="keyword">case</span> bid @ <span class="type">BroadcastBlockId</span>(`broadcastId`, _) =&gt; bid</span><br><span class="line">    &#125;</span><br><span class="line">    blocksToRemove.foreach &#123; blockId =&gt; removeBlock(blockId, tellMaster) &#125;</span><br><span class="line">    blocksToRemove.size</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * Remove a block from both memory and disk.</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="function"><span class="keyword">def</span> <span class="title">removeBlock</span></span>(blockId: <span class="type">BlockId</span>, tellMaster: <span class="type">Boolean</span> = <span class="literal">true</span>): <span class="type">Unit</span> = &#123;</span><br><span class="line">    logDebug(<span class="string">s&quot;Removing block <span class="subst">$blockId</span>&quot;</span>)</span><br><span class="line">    blockInfoManager.lockForWriting(blockId) <span class="keyword">match</span> &#123;</span><br><span class="line">      <span class="keyword">case</span> <span class="type">None</span> =&gt;</span><br><span class="line">        <span class="comment">// The block has already been removed; do nothing.</span></span><br><span class="line">        logWarning(<span class="string">s&quot;Asked to remove block <span class="subst">$blockId</span>, which does not exist&quot;</span>)</span><br><span class="line">      <span class="keyword">case</span> <span class="type">Some</span>(info) =&gt;</span><br><span class="line">        removeBlockInternal(blockId, tellMaster = tellMaster &amp;&amp; info.tellMaster)</span><br><span class="line">        addUpdatedBlockStatusToTaskMetrics(blockId, <span class="type">BlockStatus</span>.empty)</span><br><span class="line">    &#125;</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * Internal version of [[removeBlock()]] which assumes that the caller already holds a write</span></span><br><span class="line"><span class="comment">   * lock on the block.</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="keyword">private</span> <span class="function"><span class="keyword">def</span> <span class="title">removeBlockInternal</span></span>(blockId: <span class="type">BlockId</span>, tellMaster: <span class="type">Boolean</span>): <span class="type">Unit</span> = &#123;</span><br><span class="line">    <span class="keyword">val</span> blockStatus = <span class="keyword">if</span> (tellMaster) &#123;</span><br><span class="line">      <span class="keyword">val</span> blockInfo = blockInfoManager.assertBlockIsLockedForWriting(blockId)</span><br><span class="line">      <span class="type">Some</span>(getCurrentBlockStatus(blockId, blockInfo))</span><br><span class="line">    &#125; <span class="keyword">else</span> <span class="type">None</span></span><br><span class="line"></span><br><span class="line">    <span class="comment">// Removals are idempotent in disk store and memory store. At worst, we get a warning.</span></span><br><span class="line">    <span class="keyword">val</span> removedFromMemory = memoryStore.remove(blockId)</span><br><span class="line">    <span class="keyword">val</span> removedFromDisk = diskStore.remove(blockId)</span><br><span class="line">    <span class="keyword">if</span> (!removedFromMemory &amp;&amp; !removedFromDisk) &#123;</span><br><span class="line">      logWarning(<span class="string">s&quot;Block <span class="subst">$blockId</span> could not be removed as it was not found on disk or in memory&quot;</span>)</span><br><span class="line">    &#125;</span><br><span class="line"></span><br><span class="line">    blockInfoManager.removeBlock(blockId)</span><br><span class="line">    <span class="keyword">if</span> (tellMaster) &#123;</span><br><span class="line">      <span class="comment">// Only update storage level from the captured block status before deleting, so that</span></span><br><span class="line">      <span class="comment">// memory size and disk size are being kept for calculating delta.</span></span><br><span class="line">      reportBlockStatus(blockId, blockStatus.get.copy(storageLevel = <span class="type">StorageLevel</span>.<span class="type">NONE</span>))</span><br><span class="line">    &#125;</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="keyword">private</span> <span class="function"><span class="keyword">def</span> <span class="title">addUpdatedBlockStatusToTaskMetrics</span></span>(blockId: <span class="type">BlockId</span>, status: <span class="type">BlockStatus</span>): <span class="type">Unit</span> = &#123;</span><br><span class="line">    <span class="keyword">if</span> (conf.get(config.<span class="type">TASK_METRICS_TRACK_UPDATED_BLOCK_STATUSES</span>)) &#123;</span><br><span class="line">      <span class="type">Option</span>(<span class="type">TaskContext</span>.get()).foreach &#123; c =&gt;</span><br><span class="line">        c.taskMetrics().incUpdatedBlockStatuses(blockId -&gt; status)</span><br><span class="line">      &#125;</span><br><span class="line">    &#125;</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="function"><span class="keyword">def</span> <span class="title">releaseLockAndDispose</span></span>(</span><br><span class="line">      blockId: <span class="type">BlockId</span>,</span><br><span class="line">      data: <span class="type">BlockData</span>,</span><br><span class="line">      taskContext: <span class="type">Option</span>[<span class="type">TaskContext</span>] = <span class="type">None</span>): <span class="type">Unit</span> = &#123;</span><br><span class="line">    releaseLock(blockId, taskContext)</span><br><span class="line">    data.dispose()</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="function"><span class="keyword">def</span> <span class="title">stop</span></span>(): <span class="type">Unit</span> = &#123;</span><br><span class="line">    blockTransferService.close()</span><br><span class="line">    <span class="keyword">if</span> (blockStoreClient ne blockTransferService) &#123;</span><br><span class="line">      <span class="comment">// Closing should be idempotent, but maybe not for the NioBlockTransferService.</span></span><br><span class="line">      blockStoreClient.close()</span><br><span class="line">    &#125;</span><br><span class="line">    remoteBlockTempFileManager.stop()</span><br><span class="line">    diskBlockManager.stop()</span><br><span class="line">    rpcEnv.stop(slaveEndpoint)</span><br><span class="line">    blockInfoManager.clear()</span><br><span class="line">    memoryStore.clear()</span><br><span class="line">    futureExecutionContext.shutdownNow()</span><br><span class="line">    logInfo(<span class="string">&quot;BlockManager stopped&quot;</span>)</span><br><span class="line">  &#125;</span><br><span class="line">&#125;</span><br></pre></td></tr></table></figure>
