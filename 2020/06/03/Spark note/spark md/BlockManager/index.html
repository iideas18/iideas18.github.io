ationsAndStatus.status.diskSize.max(locationsAndStatus.status.memSize)</span><br><span class="line"></span><br><span class="line">      locationsAndStatus.localDirs.flatMap &#123; localDirs =&gt;</span><br><span class="line">        <span class="keyword">val</span> blockDataOption =</span><br><span class="line">          readDiskBlockFromSameHostExecutor(blockId, localDirs, locationsAndStatus.status.diskSize)</span><br><span class="line">        <span class="keyword">val</span> res = blockDataOption.flatMap &#123; blockData =&gt;</span><br><span class="line">          <span class="keyword">try</span> &#123;</span><br><span class="line">            <span class="type">Some</span>(bufferTransformer(blockData))</span><br><span class="line">          &#125; <span class="keyword">catch</span> &#123;</span><br><span class="line">            <span class="keyword">case</span> <span class="type">NonFatal</span>(e) =&gt;</span><br><span class="line">              logDebug(<span class="string">&quot;Block from the same host executor cannot be opened: &quot;</span>, e)</span><br><span class="line">              <span class="type">None</span></span><br><span class="line">          &#125;</span><br><span class="line">        &#125;</span><br><span class="line">        logInfo(<span class="string">s&quot;Read <span class="subst">$blockId</span> from the disk of a same host executor is &quot;</span> +</span><br><span class="line">          (<span class="keyword">if</span> (res.isDefined) <span class="string">&quot;successful.&quot;</span> <span class="keyword">else</span> <span class="string">&quot;failed.&quot;</span>))</span><br><span class="line">        res</span><br><span class="line">      &#125;.orElse &#123;</span><br><span class="line">        fetchRemoteManagedBuffer(blockId, blockSize, locationsAndStatus).map(bufferTransformer)</span><br><span class="line">      &#125;</span><br><span class="line">    &#125;</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="keyword">private</span> <span class="function"><span class="keyword">def</span> <span class="title">preferExecutors</span></span>(locations: <span class="type">Seq</span>[<span class="type">BlockManagerId</span>]): <span class="type">Seq</span>[<span class="type">BlockManagerId</span>] = &#123;</span><br><span class="line">    <span class="keyword">val</span> (executors, shuffleServers) = locations.partition(_.port != externalShuffleServicePort)</span><br><span class="line">    executors ++ shuffleServers</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * Return a list of locations for the given block, prioritizing the local machine since</span></span><br><span class="line"><span class="comment">   * multiple block managers can share the same host, followed by hosts on the same rack.</span></span><br><span class="line"><span class="comment">   *</span></span><br><span class="line"><span class="comment">   * Within each of the above listed groups (same host, same rack and others) executors are</span></span><br><span class="line"><span class="comment">   * preferred over the external shuffle service.</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="keyword">private</span>[spark] <span class="function"><span class="keyword">def</span> <span class="title">sortLocations</span></span>(locations: <span class="type">Seq</span>[<span class="type">BlockManagerId</span>]): <span class="type">Seq</span>[<span class="type">BlockManagerId</span>] = &#123;</span><br><span class="line">    <span class="keyword">val</span> locs = <span class="type">Random</span>.shuffle(locations)</span><br><span class="line">    <span class="keyword">val</span> (preferredLocs, otherLocs) = locs.partition(_.host == blockManagerId.host)</span><br><span class="line">    <span class="keyword">val</span> orderedParts = blockManagerId.topologyInfo <span class="keyword">match</span> &#123;</span><br><span class="line">      <span class="keyword">case</span> <span class="type">None</span> =&gt; <span class="type">Seq</span>(preferredLocs, otherLocs)</span><br><span class="line">      <span class="keyword">case</span> <span class="type">Some</span>(_) =&gt;</span><br><span class="line">        <span class="keyword">val</span> (sameRackLocs, differentRackLocs) = otherLocs.partition &#123;</span><br><span class="line">          loc =&gt; blockManagerId.topologyInfo == loc.topologyInfo</span><br><span class="line">        &#125;</span><br><span class="line">        <span class="type">Seq</span>(preferredLocs, sameRackLocs, differentRackLocs)</span><br><span class="line">    &#125;</span><br><span class="line">    orderedParts.map(preferExecutors).reduce(_ ++ _)</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * Fetch the block from remote block managers as a ManagedBuffer.</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="keyword">private</span> <span class="function"><span class="keyword">def</span> <span class="title">fetchRemoteManagedBuffer</span></span>(</span><br><span class="line">      blockId: <span class="type">BlockId</span>,</span><br><span class="line">      blockSize: <span class="type">Long</span>,</span><br><span class="line">      locationsAndStatus: <span class="type">BlockManagerMessages</span>.<span class="type">BlockLocationsAndStatus</span>): <span class="type">Option</span>[<span class="type">ManagedBuffer</span>] = &#123;</span><br><span class="line">    <span class="comment">// If the block size is above the threshold, we should pass our FileManger to</span></span><br><span class="line">    <span class="comment">// BlockTransferService, which will leverage it to spill the block; if not, then passed-in</span></span><br><span class="line">    <span class="comment">// null value means the block will be persisted in memory.</span></span><br><span class="line">    <span class="keyword">val</span> tempFileManager = <span class="keyword">if</span> (blockSize &gt; maxRemoteBlockToMem) &#123;</span><br><span class="line">      remoteBlockTempFileManager</span><br><span class="line">    &#125; <span class="keyword">else</span> &#123;</span><br><span class="line">      <span class="literal">null</span></span><br><span class="line">    &#125;</span><br><span class="line">    <span class="keyword">var</span> runningFailureCount = <span class="number">0</span></span><br><span class="line">    <span class="keyword">var</span> totalFailureCount = <span class="number">0</span></span><br><span class="line">    <span class="keyword">val</span> locations = sortLocations(locationsAndStatus.locations)</span><br><span class="line">    <span class="keyword">val</span> maxFetchFailures = locations.size</span><br><span class="line">    <span class="keyword">var</span> locationIterator = locations.iterator</span><br><span class="line">    <span class="keyword">while</span> (locationIterator.hasNext) &#123;</span><br><span class="line">      <span class="keyword">val</span> loc = locationIterator.next()</span><br><span class="line">      logDebug(<span class="string">s&quot;Getting remote block <span class="subst">$blockId</span> from <span class="subst">$loc</span>&quot;</span>)</span><br><span class="line">      <span class="keyword">val</span> data = <span class="keyword">try</span> &#123;</span><br><span class="line">        <span class="keyword">val</span> buf = blockTransferService.fetchBlockSync(loc.host, loc.port, loc.executorId,</span><br><span class="line">          blockId.toString, tempFileManager)</span><br><span class="line">        <span class="keyword">if</span> (blockSize &gt; <span class="number">0</span> &amp;&amp; buf.size() == <span class="number">0</span>) &#123;</span><br><span class="line">          <span class="keyword">throw</span> <span class="keyword">new</span> <span class="type">IllegalStateException</span>(<span class="string">&quot;Empty buffer received for non empty block&quot;</span>)</span><br><span class="line">        &#125;</span><br><span class="line">        buf</span><br><span class="line">      &#125; <span class="keyword">catch</span> &#123;</span><br><span class="line">        <span class="keyword">case</span> <span class="type">NonFatal</span>(e) =&gt;</span><br><span class="line">          runningFailureCount += <span class="number">1</span></span><br><span class="line">          totalFailureCount += <span class="number">1</span></span><br><span class="line"></span><br><span class="line">          <span class="keyword">if</span> (totalFailureCount &gt;= maxFetchFailures) &#123;</span><br><span class="line">            <span class="comment">// Give up trying anymore locations. Either we&#x27;ve tried all of the original locations,</span></span><br><span class="line">            <span class="comment">// or we&#x27;ve refreshed the list of locations from the master, and have still</span></span><br><span class="line">            <span class="comment">// hit failures after trying locations from the refreshed list.</span></span><br><span class="line">            logWarning(<span class="string">s&quot;Failed to fetch block after <span class="subst">$totalFailureCount</span> fetch failures. &quot;</span> +</span><br><span class="line">              <span class="string">s&quot;Most recent failure cause:&quot;</span>, e)</span><br><span class="line">            <span class="keyword">return</span> <span class="type">None</span></span><br><span class="line">          &#125;</span><br><span class="line"></span><br><span class="line">          logWarning(<span class="string">s&quot;Failed to fetch remote block <span class="subst">$blockId</span> &quot;</span> +</span><br><span class="line">            <span class="string">s&quot;from <span class="subst">$loc</span> (failed attempt <span class="subst">$runningFailureCount</span>)&quot;</span>, e)</span><br><span class="line"></span><br><span class="line">          <span class="comment">// If there is a large number of executors then locations list can contain a</span></span><br><span class="line">          <span class="comment">// large number of stale entries causing a large number of retries that may</span></span><br><span class="line">          <span class="comment">// take a significant amount of time. To get rid of these stale entries</span></span><br><span class="line">          <span class="comment">// we refresh the block locations after a certain number of fetch failures</span></span><br><span class="line">          <span class="keyword">if</span> (runningFailureCount &gt;= maxFailuresBeforeLocationRefresh) &#123;</span><br><span class="line">            locationIterator = sortLocations(master.getLocations(blockId)).iterator</span><br><span class="line">            logDebug(<span class="string">s&quot;Refreshed locations from the driver &quot;</span> +</span><br><span class="line">              <span class="string">s&quot;after <span class="subst">$&#123;runningFailureCount&#125;</span> fetch failures.&quot;</span>)</span><br><span class="line">            runningFailureCount = <span class="number">0</span></span><br><span class="line">          &#125;</span><br><span class="line"></span><br><span class="line">          <span class="comment">// This location failed, so we retry fetch from a different one by returning null here</span></span><br><span class="line">          <span class="literal">null</span></span><br><span class="line">      &#125;</span><br><span class="line"></span><br><span class="line">      <span class="keyword">if</span> (data != <span class="literal">null</span>) &#123;</span><br><span class="line">        <span class="comment">// If the ManagedBuffer is a BlockManagerManagedBuffer, the disposal of the</span></span><br><span class="line">        <span class="comment">// byte buffers backing it may need to be handled after reading the bytes.</span></span><br><span class="line">        <span class="comment">// In this case, since we just fetched the bytes remotely, we do not have</span></span><br><span class="line">        <span class="comment">// a BlockManagerManagedBuffer. The assert here is to ensure that this holds</span></span><br><span class="line">        <span class="comment">// true (or the disposal is handled).</span></span><br><span class="line">        assert(!data.isInstanceOf[<span class="type">BlockManagerManagedBuffer</span>])</span><br><span class="line">        <span class="keyword">return</span> <span class="type">Some</span>(data)</span><br><span class="line">      &#125;</span><br><span class="line">      logDebug(<span class="string">s&quot;The value of block <span class="subst">$blockId</span> is null&quot;</span>)</span><br><span class="line">    &#125;</span><br><span class="line">    logDebug(<span class="string">s&quot;Block <span class="subst">$blockId</span> not found&quot;</span>)</span><br><span class="line">    <span class="type">None</span></span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * Reads the block from the local directories of another executor which runs on the same host.</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="keyword">private</span>[spark] <span class="function"><span class="keyword">def</span> <span class="title">readDiskBlockFromSameHostExecutor</span></span>(</span><br><span class="line">      blockId: <span class="type">BlockId</span>,</span><br><span class="line">      localDirs: <span class="type">Array</span>[<span class="type">String</span>],</span><br><span class="line">      blockSize: <span class="type">Long</span>): <span class="type">Option</span>[<span class="type">ManagedBuffer</span>] = &#123;</span><br><span class="line">    <span class="keyword">val</span> file = <span class="type">ExecutorDiskUtils</span>.getFile(localDirs, subDirsPerLocalDir, blockId.name)</span><br><span class="line">    <span class="keyword">if</span> (file.exists()) &#123;</span><br><span class="line">      <span class="keyword">val</span> mangedBuffer = securityManager.getIOEncryptionKey() <span class="keyword">match</span> &#123;</span><br><span class="line">        <span class="keyword">case</span> <span class="type">Some</span>(key) =&gt;</span><br><span class="line">          <span class="comment">// Encrypted blocks cannot be memory mapped; return a special object that does decryption</span></span><br><span class="line">          <span class="comment">// and provides InputStream / FileRegion implementations for reading the data.</span></span><br><span class="line">          <span class="keyword">new</span> <span class="type">EncryptedManagedBuffer</span>(</span><br><span class="line">            <span class="keyword">new</span> <span class="type">EncryptedBlockData</span>(file, blockSize, conf, key))</span><br><span class="line"></span><br><span class="line">        <span class="keyword">case</span> _ =&gt;</span><br><span class="line">          <span class="keyword">val</span> transportConf = <span class="type">SparkTransportConf</span>.fromSparkConf(conf, <span class="string">&quot;shuffle&quot;</span>)</span><br><span class="line">          <span class="keyword">new</span> <span class="type">FileSegmentManagedBuffer</span>(transportConf, file, <span class="number">0</span>, file.length)</span><br><span class="line">      &#125;</span><br><span class="line">      <span class="type">Some</span>(mangedBuffer)</span><br><span class="line">    &#125; <span class="keyword">else</span> &#123;</span><br><span class="line">      <span class="type">None</span></span><br><span class="line">    &#125;</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * Get block from remote block managers as serialized bytes.</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="function"><span class="keyword">def</span> <span class="title">getRemoteBytes</span></span>(blockId: <span class="type">BlockId</span>): <span class="type">Option</span>[<span class="type">ChunkedByteBuffer</span>] = &#123;</span><br><span class="line">    getRemoteBlock(blockId, (data: <span class="type">ManagedBuffer</span>) =&gt; &#123;</span><br><span class="line">      <span class="comment">// SPARK-24307 undocumented &quot;escape-hatch&quot; in case there are any issues in converting to</span></span><br><span class="line">      <span class="comment">// ChunkedByteBuffer, to go back to old code-path.  Can be removed post Spark 2.4 if</span></span><br><span class="line">      <span class="comment">// new path is stable.</span></span><br><span class="line">      <span class="keyword">if</span> (remoteReadNioBufferConversion) &#123;</span><br><span class="line">        <span class="keyword">new</span> <span class="type">ChunkedByteBuffer</span>(data.nioByteBuffer())</span><br><span class="line">      &#125; <span class="keyword">else</span> &#123;</span><br><span class="line">        <span class="type">ChunkedByteBuffer</span>.fromManagedBuffer(data)</span><br><span class="line">      &#125;</span><br><span class="line">    &#125;)</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * Get a block from the block manager (either local or remote).</span></span><br><span class="line"><span class="comment">   *</span></span><br><span class="line"><span class="comment">   * This acquires a read lock on the block if the block was stored locally and does not acquire</span></span><br><span class="line"><span class="comment">   * any locks if the block was fetched from a remote block manager. The read lock will</span></span><br><span class="line"><span class="comment">   * automatically be freed once the result&#x27;s `data` iterator is fully consumed.</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="function"><span class="keyword">def</span> <span class="title">get</span></span>[<span class="type">T</span>: <span class="type">ClassTag</span>](blockId: <span class="type">BlockId</span>): <span class="type">Option</span>[<span class="type">BlockResult</span>] = &#123;</span><br><span class="line">    <span class="keyword">val</span> local = getLocalValues(blockId)</span><br><span class="line">    <span class="keyword">if</span> (local.isDefined) &#123;</span><br><span class="line">      logInfo(<span class="string">s&quot;Found block <span class="subst">$blockId</span> locally&quot;</span>)</span><br><span class="line">      <span class="keyword">return</span> local</span><br><span class="line">    &#125;</span><br><span class="line">    <span class="keyword">val</span> remote = getRemoteValues[<span class="type">T</span>](blockId)</span><br><span class="line">    <span class="keyword">if</span> (remote.isDefined) &#123;</span><br><span class="line">      logInfo(<span class="string">s&quot;Found block <span class="subst">$blockId</span> remotely&quot;</span>)</span><br><span class="line">      <span class="keyword">return</span> remote</span><br><span class="line">    &#125;</span><br><span class="line">    <span class="type">None</span></span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * Downgrades an exclusive write lock to a shared read lock.</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="function"><span class="keyword">def</span> <span class="title">downgradeLock</span></span>(blockId: <span class="type">BlockId</span>): <span class="type">Unit</span> = &#123;</span><br><span class="line">    blockInfoManager.downgradeLock(blockId)</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * Release a lock on the given block with explicit TaskContext.</span></span><br><span class="line"><span class="comment">   * The param `taskContext` should be passed in case we can&#x27;t get the correct TaskContext,</span></span><br><span class="line"><span class="comment">   * for example, the input iterator of a cached RDD iterates to the end in a child</span></span><br><span class="line"><span class="comment">   * thread.</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="function"><span class="keyword">def</span> <span class="title">releaseLock</span></span>(blockId: <span class="type">BlockId</span>, taskContext: <span class="type">Option</span>[<span class="type">TaskContext</span>] = <span class="type">None</span>): <span class="type">Unit</span> = &#123;</span><br><span class="line">    <span class="keyword">val</span> taskAttemptId = taskContext.map(_.taskAttemptId())</span><br><span class="line">    <span class="comment">// SPARK-27666. When a task completes, Spark automatically releases all the blocks locked</span></span><br><span class="line">    <span class="comment">// by this task. We should not release any locks for a task that is already completed.</span></span><br><span class="line">    <span class="keyword">if</span> (taskContext.isDefined &amp;&amp; taskContext.get.isCompleted) &#123;</span><br><span class="line">      logWarning(<span class="string">s&quot;Task <span class="subst">$&#123;taskAttemptId.get&#125;</span> already completed, not releasing lock for <span class="subst">$blockId</span>&quot;</span>)</span><br><span class="line">    &#125; <span class="keyword">else</span> &#123;</span><br><span class="line">      blockInfoManager.unlock(blockId, taskAttemptId)</span><br><span class="line">    &#125;</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * Registers a task with the BlockManager in order to initialize per-task bookkeeping structures.</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="function"><span class="keyword">def</span> <span class="title">registerTask</span></span>(taskAttemptId: <span class="type">Long</span>): <span class="type">Unit</span> = &#123;</span><br><span class="line">    blockInfoManager.registerTask(taskAttemptId)</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * Release all locks for the given task.</span></span><br><span class="line"><span class="comment">   *</span></span><br><span class="line"><span class="comment">   * @return the blocks whose locks were released.</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="function"><span class="keyword">def</span> <span class="title">releaseAllLocksForTask</span></span>(taskAttemptId: <span class="type">Long</span>): <span class="type">Seq</span>[<span class="type">BlockId</span>] = &#123;</span><br><span class="line">    blockInfoManager.releaseAllLocksForTask(taskAttemptId)</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * Retrieve the given block if it exists, otherwise call the provided `makeIterator` method</span></span><br><span class="line"><span class="comment">   * to compute the block, persist it, and return its values.</span></span><br><span class="line"><span class="comment">   *</span></span><br><span class="line"><span class="comment">   * @return either a BlockResult if the block was successfully cached, or an iterator if the block</span></span><br><span class="line"><span class="comment">   *         could not be cached.</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="function"><span class="keyword">def</span> <span class="title">getOrElseUpdate</span></span>[<span class="type">T</span>](</span><br><span class="line">      blockId: <span class="type">BlockId</span>,</span><br><span class="line">      level: <span class="type">StorageLevel</span>,</span><br><span class="line">      classTag: <span class="type">ClassTag</span>[<span class="type">T</span>],</span><br><span class="line">      makeIterator: () =&gt; <span class="type">Iterator</span>[<span class="type">T</span>]): <span class="type">Either</span>[<span class="type">BlockResult</span>, <span class="type">Iterator</span>[<span class="type">T</span>]] = &#123;</span><br><span class="line">    <span class="comment">// Attempt to read the block from local or remote storage. If it&#x27;s present, then we don&#x27;t need</span></span><br><span class="line">    <span class="comment">// to go through the local-get-or-put path.</span></span><br><span class="line">    get[<span class="type">T</span>](blockId)(classTag) <span class="keyword">match</span> &#123;</span><br><span class="line">      <span class="keyword">case</span> <span class="type">Some</span>(block) =&gt;</span><br><span class="line">        <span class="keyword">return</span> <span class="type">Left</span>(block)</span><br><span class="line">      <span class="keyword">case</span> _ =&gt;</span><br><span class="line">        <span class="comment">// Need to compute the block.</span></span><br><span class="line">    &#125;</span><br><span class="line">    <span class="comment">// Initially we hold no locks on this block.</span></span><br><span class="line">    doPutIterator(blockId, makeIterator, level, classTag, keepReadLock = <span class="literal">true</span>) <span class="keyword">match</span> &#123;</span><br><span class="line">      <span class="keyword">case</span> <span class="type">None</span> =&gt;</span><br><span class="line">        <span class="comment">// doPut() didn&#x27;t hand work back to us, so the block already existed or was successfully</span></span><br><span class="line">        <span class="comment">// stored. Therefore, we now hold a read lock on the block.</span></span><br><span class="line">        <span class="keyword">val</span> blockResult = getLocalValues(blockId).getOrElse &#123;</span><br><span class="line">          <span class="comment">// Since we held a read lock between the doPut() and get() calls, the block should not</span></span><br><span class="line">          <span class="comment">// have been evicted, so get() not returning the block indicates some internal error.</span></span><br><span class="line">          releaseLock(blockId)</span><br><span class="line">          <span class="keyword">throw</span> <span class="keyword">new</span> <span class="type">SparkException</span>(<span class="string">s&quot;get() failed for block <span class="subst">$blockId</span> even though we held a lock&quot;</span>)</span><br><span class="line">        &#125;</span><br><span class="line">        <span class="comment">// We already hold a read lock on the block from the doPut() call and getLocalValues()</span></span><br><span class="line">        <span class="comment">// acquires the lock again, so we need to call releaseLock() here so that the net number</span></span><br><span class="line">        <span class="comment">// of lock acquisitions is 1 (since the caller will only call release() once).</span></span><br><span class="line">        releaseLock(blockId)</span><br><span class="line">        <span class="type">Left</span>(blockResult)</span><br><span class="line">      <span class="keyword">case</span> <span class="type">Some</span>(iter) =&gt;</span><br><span class="line">        <span class="comment">// The put failed, likely because the data was too large to fit in memory and could not be</span></span><br><span class="line">        <span class="comment">// dropped to disk. Therefore, we need to pass the input iterator back to the caller so</span></span><br><span class="line">        <span class="comment">// that they can decide what to do with the values (e.g. process them without caching).</span></span><br><span class="line">       <span class="type">Right</span>(iter)</span><br><span class="line">    &#125;</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * @return true if the block was stored or false if an error occurred.</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="function"><span class="keyword">def</span> <span class="title">putIterator</span></span>[<span class="type">T</span>: <span class="type">ClassTag</span>](</span><br><span class="line">      blockId: <span class="type">BlockId</span>,</span><br><span class="line">      values: <span class="type">Iterator</span>[<span class="type">T</span>],</span><br><span class="line">      level: <span class="type">StorageLevel</span>,</span><br><span class="line">      tellMaster: <span class="type">Boolean</span> = <span class="literal">true</span>): <span class="type">Boolean</span> = &#123;</span><br><span class="line">    require(values != <span class="literal">null</span>, <span class="string">&quot;Values is null&quot;</span>)</span><br><span class="line">    doPutIterator(blockId, () =&gt; values, level, implicitly[<span class="type">ClassTag</span>[<span class="type">T</span>]], tellMaster) <span class="keyword">match</span> &#123;</span><br><span class="line">      <span class="keyword">case</span> <span class="type">None</span> =&gt;</span><br><span class="line">        <span class="literal">true</span></span><br><span class="line">      <span class="keyword">case</span> <span class="type">Some</span>(iter) =&gt;</span><br><span class="line">        <span class="comment">// Caller doesn&#x27;t care about the iterator values, so we can close the iterator here</span></span><br><span class="line">        <span class="comment">// to free resources earlier</span></span><br><span class="line">        iter.close()</span><br><span class="line">        <span class="literal">false</span></span><br><span class="line">    &#125;</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * A short circuited method to get a block writer that can write data directly to disk.</span></span><br><span class="line"><span class="comment">   * The Block will be appended to the File specified by filename. Callers should handle error</span></span><br><span class="line"><span class="comment">   * cases.</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="function"><span class="keyword">def</span> <span class="title">getDiskWriter</span></span>(</span><br><span class="line">      blockId: <span class="type">BlockId</span>,</span><br><span class="line">      file: <span class="type">File</span>,</span><br><span class="line">      serializerInstance: <span class="type">SerializerInstance</span>,</span><br><span class="line">      bufferSize: <span class="type">Int</span>,</span><br><span class="line">      writeMetrics: <span class="type">ShuffleWriteMetricsReporter</span>): <span class="type">DiskBlockObjectWriter</span> = &#123;</span><br><span class="line">    <span class="keyword">val</span> syncWrites = conf.get(config.<span class="type">SHUFFLE_SYNC</span>)</span><br><span class="line">    <span class="keyword">new</span> <span class="type">DiskBlockObjectWriter</span>(file, serializerManager, serializerInstance, bufferSize,</span><br><span class="line">      syncWrites, writeMetrics, blockId)</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * Put a new block of serialized bytes to the block manager.</span></span><br><span class="line"><span class="comment">   *</span></span><br><span class="line"><span class="comment">   * &#x27;&#x27;&#x27;Important!&#x27;&#x27;&#x27; Callers must not mutate or release the data buffer underlying `bytes`. Doing</span></span><br><span class="line"><span class="comment">   * so may corrupt or change the data stored by the `BlockManager`.</span></span><br><span class="line"><span class="comment">   *</span></span><br><span class="line"><span class="comment">   * @return true if the block was stored or false if an error occurred.</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="function"><span class="keyword">def</span> <span class="title">putBytes</span></span>[<span class="type">T</span>: <span class="type">ClassTag</span>](</span><br><span class="line">      blockId: <span class="type">BlockId</span>,</span><br><span class="line">      bytes: <span class="type">ChunkedByteBuffer</span>,</span><br><span class="line">      level: <span class="type">StorageLevel</span>,</span><br><span class="line">      tellMaster: <span class="type">Boolean</span> = <span class="literal">true</span>): <span class="type">Boolean</span> = &#123;</span><br><span class="line">    require(bytes != <span class="literal">null</span>, <span class="string">&quot;Bytes is null&quot;</span>)</span><br><span class="line">    <span class="keyword">val</span> blockStoreUpdater =</span><br><span class="line">      <span class="type">ByteBufferBlockStoreUpdater</span>(blockId, level, implicitly[<span class="type">ClassTag</span>[<span class="type">T</span>]], bytes, tellMaster)</span><br><span class="line">    blockStoreUpdater.save()</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * Helper method used to abstract common code from [[BlockStoreUpdater.save()]]</span></span><br><span class="line"><span class="comment">   * and [[doPutIterator()]].</span></span><br><span class="line"><span class="comment">   *</span></span><br><span class="line"><span class="comment">   * @param putBody a function which attempts the actual put() and returns None on success</span></span><br><span class="line"><span class="comment">   *                or Some on failure.</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="keyword">private</span> <span class="function"><span class="keyword">def</span> <span class="title">doPut</span></span>[<span class="type">T</span>](</span><br><span class="line">      blockId: <span class="type">BlockId</span>,</span><br><span class="line">      level: <span class="type">StorageLevel</span>,</span><br><span class="line">      classTag: <span class="type">ClassTag</span>[_],</span><br><span class="line">      tellMaster: <span class="type">Boolean</span>,</span><br><span class="line">      keepReadLock: <span class="type">Boolean</span>)(putBody: <span class="type">BlockInfo</span> =&gt; <span class="type">Option</span>[<span class="type">T</span>]): <span class="type">Option</span>[<span class="type">T</span>] = &#123;</span><br><span class="line"></span><br><span class="line">    require(blockId != <span class="literal">null</span>, <span class="string">&quot;BlockId is null&quot;</span>)</span><br><span class="line">    require(level != <span class="literal">null</span> &amp;&amp; level.isValid, <span class="string">&quot;StorageLevel is null or invalid&quot;</span>)</span><br><span class="line"></span><br><span class="line">    <span class="keyword">val</span> putBlockInfo = &#123;</span><br><span class="line">      <span class="keyword">val</span> newInfo = <span class="keyword">new</span> <span class="type">BlockInfo</span>(level, classTag, tellMaster)</span><br><span class="line">      <span class="keyword">if</span> (blockInfoManager.lockNewBlockForWriting(blockId, newInfo)) &#123;</span><br><span class="line">        newInfo</span><br><span class="line">      &#125; <span class="keyword">else</span> &#123;</span><br><span class="line">        logWarning(<span class="string">s&quot;Block <span class="subst">$blockId</span> already exists on this machine; not re-adding it&quot;</span>)</span><br><span class="line">        <span class="keyword">if</span> (!keepReadLock) &#123;</span><br><span class="line">          <span class="comment">// lockNewBlockForWriting returned a read lock on the existing block, so we must free it:</span></span><br><span class="line">          releaseLock(blockId)</span><br><span class="line">        &#125;</span><br><span class="line">        <span class="keyword">return</span> <span class="type">None</span></span><br><span class="line">      &#125;</span><br><span class="line">    &#125;</span><br><span class="line"></span><br><span class="line">    <span class="keyword">val</span> startTimeNs = <span class="type">System</span>.nanoTime()</span><br><span class="line">    <span class="keyword">var</span> exceptionWasThrown: <span class="type">Boolean</span> = <span class="literal">true</span></span><br><span class="line">    <span class="keyword">val</span> result: <span class="type">Option</span>[<span class="type">T</span>] = <span class="keyword">try</span> &#123;</span><br><span class="line">      <span class="keyword">val</span> res = putBody(putBlockInfo)</span><br><span class="line">      exceptionWasThrown = <span class="literal">false</span></span><br><span class="line">      <span class="keyword">if</span> (res.isEmpty) &#123;</span><br><span class="line">        <span class="comment">// the block was successfully stored</span></span><br><span class="line">        <span class="keyword">if</span> (keepReadLock) &#123;</span><br><span class="line">          blockInfoManager.downgradeLock(blockId)</span><br><span class="line">        &#125; <span class="keyword">else</span> &#123;</span><br><span class="line">          blockInfoManager.unlock(blockId)</span><br><span class="line">        &#125;</span><br><span class="line">      &#125; <span class="keyword">else</span> &#123;</span><br><span class="line">        removeBlockInternal(blockId, tellMaster = <span class="literal">false</span>)</span><br><span class="line">        logWarning(<span class="string">s&quot;Putting block <span class="subst">$blockId</span> failed&quot;</span>)</span><br><span class="line">      &#125;</span><br><span class="line">      res</span><br><span class="line">    &#125; <span class="keyword">catch</span> &#123;</span><br><span class="line">      <span class="comment">// Since removeBlockInternal may throw exception,</span></span><br><span class="line">      <span class="comment">// we should print exception first to show root cause.</span></span><br><span class="line">      <span class="keyword">case</span> <span class="type">NonFatal</span>(e) =&gt;</span><br><span class="line">        logWarning(<span class="string">s&quot;Putting block <span class="subst">$blockId</span> failed due to exception <span class="subst">$e</span>.&quot;</span>)</span><br><span class="line">        <span class="keyword">throw</span> e</span><br><span class="line">    &#125; <span class="keyword">finally</span> &#123;</span><br><span class="line">      <span class="comment">// This cleanup is performed in a finally block rather than a `catch` to avoid having to</span></span><br><span class="line">      <span class="comment">// catch and properly re-throw InterruptedException.</span></span><br><span class="line">      <span class="keyword">if</span> (exceptionWasThrown) &#123;</span><br><span class="line">        <span class="comment">// If an exception was thrown then it&#x27;s possible that the code in `putBody` has already</span></span><br><span class="line">        <span class="comment">// notified the master about the availability of this block, so we need to send an update</span></span><br><span class="line">        <span class="comment">// to remove this block location.</span></span><br><span class="line">        removeBlockInternal(blockId, tellMaster = tellMaster)</span><br><span class="line">        <span class="comment">// The `putBody` code may have also added a new block status to TaskMetrics, so we need</span></span><br><span class="line">        <span class="comment">// to cancel that out by overwriting it with an empty block status. We only do this if</span></span><br><span class="line">        <span class="comment">// the finally block was entered via an exception because doing this unconditionally would</span></span><br><span class="line">        <span class="comment">// cause us to send empty block statuses for every block that failed to be cached due to</span></span><br><span class="line">        <span class="comment">// a memory shortage (which is an expected failure, unlike an uncaught exception).</span></span><br><span class="line">        addUpdatedBlockStatusToTaskMetrics(blockId, <span class="type">BlockStatus</span>.empty)</span><br><span class="line">      &#125;</span><br><span class="line">    &#125;</span><br><span class="line">    <span class="keyword">val</span> usedTimeMs = <span class="type">Utils</span>.getUsedTimeNs(startTimeNs)</span><br><span class="line">    <span class="keyword">if</span> (level.replication &gt; <span class="number">1</span>) &#123;</span><br><span class="line">      logDebug(<span class="string">s&quot;Putting block <span class="subst">$&#123;blockId&#125;</span> with replication took <span class="subst">$usedTimeMs</span>&quot;</span>)</span><br><span class="line">    &#125; <span class="keyword">else</span> &#123;</span><br><span class="line">      logDebug(<span class="string">s&quot;Putting block <span class="subst">$&#123;blockId&#125;</span> without replication took <span class="subst">$&#123;usedTimeMs&#125;</span>&quot;</span>)</span><br><span class="line">    &#125;</span><br><span class="line">    result</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * Put the given block according to the given level in one of the block stores, replicating</span></span><br><span class="line"><span class="comment">   * the values if necessary.</span></span><br><span class="line"><span class="comment">   *</span></span><br><span class="line"><span class="comment">   * If the block already exists, this method will not overwrite it.</span></span><br><span class="line"><span class="comment">   *</span></span><br><span class="line"><span class="comment">   * @param keepReadLock if true, this method will hold the read lock when it returns (even if the</span></span><br><span class="line"><span class="comment">   *                     block already exists). If false, this method will hold no locks when it</span></span><br><span class="line"><span class="comment">   *                     returns.</span></span><br><span class="line"><span class="comment">   * @return None if the block was already present or if the put succeeded, or Some(iterator)</span></span><br><span class="line"><span class="comment">   *         if the put failed.</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="keyword">private</span> <span class="function"><span class="keyword">def</span> <span class="title">doPutIterator</span></span>[<span class="type">T</span>](</span><br><span class="line">      blockId: <span class="type">BlockId</span>,</span><br><span class="line">      iterator: () =&gt; <span class="type">Iterator</span>[<span class="type">T</span>],</span><br><span class="line">      level: <span class="type">StorageLevel</span>,</span><br><span class="line">      classTag: <span class="type">ClassTag</span>[<span class="type">T</span>],</span><br><span class="line">      tellMaster: <span class="type">Boolean</span> = <span class="literal">true</span>,</span><br><span class="line">      keepReadLock: <span class="type">Boolean</span> = <span class="literal">false</span>): <span class="type">Option</span>[<span class="type">PartiallyUnrolledIterator</span>[<span class="type">T</span>]] = &#123;</span><br><span class="line">    doPut(blockId, level, classTag, tellMaster = tellMaster, keepReadLock = keepReadLock) &#123; info =&gt;</span><br><span class="line">      <span class="keyword">val</span> startTimeNs = <span class="type">System</span>.nanoTime()</span><br><span class="line">      <span class="keyword">var</span> iteratorFromFailedMemoryStorePut: <span class="type">Option</span>[<span class="type">PartiallyUnrolledIterator</span>[<span class="type">T</span>]] = <span class="type">None</span></span><br><span class="line">      <span class="comment">// Size of the block in bytes</span></span><br><span class="line">      <span class="keyword">var</span> size = <span class="number">0</span>L</span><br><span class="line">      <span class="keyword">if</span> (level.useMemory) &#123;</span><br><span class="line">        <span class="comment">// Put it in memory first, even if it also has useDisk set to true;</span></span><br><span class="line">        <span class="comment">// We will drop it to disk later if the memory store can&#x27;t hold it.</span></span><br><span class="line">        <span class="keyword">if</span> (level.deserialized) &#123;</span><br><span class="line">          memoryStore.putIteratorAsValues(blockId, iterator(), classTag) <span class="keyword">match</span> &#123;</span><br><span class="line">            <span class="keyword">case</span> <span class="type">Right</span>(s) =&gt;</span><br><span class="line">              size = s</span><br><span class="line">            <span class="keyword">case</span> <span class="type">Left</span>(iter) =&gt;</span><br><span class="line">              <span class="comment">// Not enough space to unroll this block; drop to disk if applicable</span></span><br><span class="line">              <span class="keyword">if</span> (level.useDisk) &#123;</span><br><span class="line">                logWarning(<span class="string">s&quot;Persisting block <span class="subst">$blockId</span> to disk instead.&quot;</span>)</span><br><span class="line">                diskStore.put(blockId) &#123; channel =&gt;</span><br><span class="line">                  <span class="keyword">val</span> out = <span class="type">Channels</span>.newOutputStream(channel)</span><br><span class="line">                  serializerManager.dataSerializeStream(blockId, out, iter)(classTag)</span><br><span class="line">                &#125;</span><br><span class="line">                size = diskStore.getSize(blockId)</span><br><span class="line">              &#125; <span class="keyword">else</span> &#123;</span><br><span class="line">                iteratorFromFailedMemoryStorePut = <span class="type">Some</span>(iter)</span><br><span class="line">              &#125;</span><br><span class="line">          &#125;</span><br><span class="line">        &#125; <span class="keyword">else</span> &#123; <span class="comment">// !level.deserialized</span></span><br><span class="line">          memoryStore.putIteratorAsBytes(blockId, iterator(), classTag, level.memoryMode) <span class="keyword">match</span> &#123;</span><br><span class="line">            <span class="keyword">case</span> <span class="type">Right</span>(s) =&gt;</span><br><span class="line">              size = s</span><br><span class="line">            <span class="keyword">case</span> <span class="type">Left</span>(partiallySerializedValues) =&gt;</span><br><span class="line">              <span class="comment">// Not enough space to unroll this block; drop to disk if applicable</span></span><br><span class="line">              <span class="keyword">if</span> (level.useDisk) &#123;</span><br><span class="line">                logWarning(<span class="string">s&quot;Persisting block <span class="subst">$blockId</span> to disk instead.&quot;</span>)</span><br><span class="line">                diskStore.put(blockId) &#123; channel =&gt;</span><br><span class="line">                  <span class="keyword">val</span> out = <span class="type">Channels</span>.newOutputStream(channel)</span><br><span class="line">                  partiallySerializedValues.finishWritingToStream(out)</span><br><span class="line">                &#125;</span><br><span class="line">                size = diskStore.getSize(blockId)</span><br><span class="line">              &#125; <span class="keyword">else</span> &#123;</span><br><span class="line">                iteratorFromFailedMemoryStorePut = <span class="type">Some</span>(partiallySerializedValues.valuesIterator)</span><br><span class="line">              &#125;</span><br><span class="line">          &#125;</span><br><span class="line">        &#125;</span><br><span class="line"></span><br><span class="line">      &#125; <span class="keyword">else</span> <span class="keyword">if</span> (level.useDisk) &#123;</span><br><span class="line">        diskStore.put(blockId) &#123; channel =&gt;</span><br><span class="line">          <span class="keyword">val</span> out = <span class="type">Channels</span>.newOutputStream(channel)</span><br><span class="line">          serializerManager.dataSerializeStream(blockId, out, iterator())(classTag)</span><br><span class="line">        &#125;</span><br><span class="line">        size = diskStore.getSize(blockId)</span><br><span class="line">      &#125;</span><br><span class="line"></span><br><span class="line">      <span class="keyword">val</span> putBlockStatus = getCurrentBlockStatus(blockId, info)</span><br><span class="line">      <span class="keyword">val</span> blockWasSuccessfullyStored = putBlockStatus.storageLevel.isValid</span><br><span class="line">      <span class="keyword">if</span> (blockWasSuccessfullyStored) &#123;</span><br><span class="line">        <span class="comment">// Now that the block is in either the memory or disk store, tell the master about it.</span></span><br><span class="line">        info.size = size</span><br><span class="line">        <span class="keyword">if</span> (tellMaster &amp;&amp; info.tellMaster) &#123;</span><br><span class="line">          reportBlockStatus(blockId, putBlockStatus)</span><br><span class="line">        &#125;</span><br><span class="line">        addUpdatedBlockStatusToTaskMetrics(blockId, putBlockStatus)</span><br><span class="line">        logDebug(<span class="string">s&quot;Put block <span class="subst">$blockId</span> locally took <span class="subst">$&#123;Utils.getUsedTimeNs(startTimeNs)&#125;</span>&quot;</span>)</span><br><span class="line">        <span class="keyword">if</span> (level.replication &gt; <span class="number">1</span>) &#123;</span><br><span class="line">          <span class="keyword">val</span> remoteStartTimeNs = <span class="type">System</span>.nanoTime()</span><br><span class="line">          <span class="keyword">val</span> bytesToReplicate = doGetLocalBytes(blockId, info)</span><br><span class="line">          <span class="comment">// [SPARK-16550] Erase the typed classTag when using default serialization, since</span></span><br><span class="line">          <span class="comment">// NettyBlockRpcServer crashes when deserializing repl-defined classes.</span></span><br><span class="line">          <span class="comment">// TODO(ekl) remove this once the classloader issue on the remote end is fixed.</span></span><br><span class="line">          <span class="keyword">val</span> remoteClassTag = <span class="keyword">if</span> (!serializerManager.canUseKryo(classTag)) &#123;</span><br><span class="line">            scala.reflect.classTag[<span class="type">Any</span>]</span><br><span class="line">          &#125; <span class="keyword">else</span> &#123;</span><br><span class="line">            classTag</span><br><span class="line">          &#125;</span><br><span class="line">          <span class="keyword">try</span> &#123;</span><br><span class="line">            replicate(blockId, bytesToReplicate, level, remoteClassTag)</span><br><span class="line">          &#125; <span class="keyword">finally</span> &#123;</span><br><span class="line">            bytesToReplicate.dispose()</span><br><span class="line">          &#125;</span><br><span class="line">          logDebug(<span class="string">s&quot;Put block <span class="subst">$blockId</span> remotely took <span class="subst">$&#123;Utils.getUsedTimeNs(remoteStartTimeNs)&#125;</span>&quot;</span>)</span><br><span class="line">        &#125;</span><br><span class="line">      &#125;</span><br><span class="line">      assert(blockWasSuccessfullyStored == iteratorFromFailedMemoryStorePut.isEmpty)</span><br><span class="line">      iteratorFromFailedMemoryStorePut</span><br><span class="line">    &#125;</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * Attempts to cache spilled bytes read from disk into the MemoryStore in order to speed up</span></span><br><span class="line"><span class="comment">   * subsequent reads. This method requires the caller to hold a read lock on the block.</span></span><br><span class="line"><span class="comment">   *</span></span><br><span class="line"><span class="comment">   * @return a copy of the bytes from the memory store if the put succeeded, otherwise None.</span></span><br><span class="line"><span class="comment">   *         If this returns bytes from the memory store then the original disk store bytes will</span></span><br><span class="line"><span class="comment">   *         automatically be disposed and the caller should not continue to use them. Otherwise,</span></span><br><span class="line"><span class="comment">   *         if this returns None then the original disk store bytes will be unaffected.</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="keyword">private</span> <span class="function"><span class="keyword">def</span> <span class="title">maybeCacheDiskBytesInMemory</span></span>(</span><br><span class="line">      blockInfo: <span class="type">BlockInfo</span>,</span><br><span class="line">      blockId: <span class="type">BlockId</span>,</span><br><span class="line">      level: <span class="type">StorageLevel</span>,</span><br><span class="line">      diskData: <span class="type">BlockData</span>): <span class="type">Option</span>[<span class="type">ChunkedByteBuffer</span>] = &#123;</span><br><span class="line">    require(!level.deserialized)</span><br><span class="line">    <span class="keyword">if</span> (level.useMemory) &#123;</span><br><span class="line">      <span class="comment">// Synchronize on blockInfo to guard against a race condition where two readers both try to</span></span><br><span class="line">      <span class="comment">// put values read from disk into the MemoryStore.</span></span><br><span class="line">      blockInfo.synchronized &#123;</span><br><span class="line">        <span class="keyword">if</span> (memoryStore.contains(blockId)) &#123;</span><br><span class="line">          diskData.dispose()</span><br><span class="line">          <span class="type">Some</span>(memoryStore.getBytes(blockId).get)</span><br><span class="line">        &#125; <span class="keyword">else</span> &#123;</span><br><span class="line">          <span class="keyword">val</span> allocator = level.memoryMode <span class="keyword">match</span> &#123;</span><br><span class="line">            <span class="keyword">case</span> <span class="type">MemoryMode</span>.<span class="type">ON_HEAP</span> =&gt; <span class="type">ByteBuffer</span>.allocate _</span><br><span class="line">            <span class="keyword">case</span> <span class="type">MemoryMode</span>.<span class="type">OFF_HEAP</span> =&gt; <span class="type">Platform</span>.allocateDirectBuffer _</span><br><span class="line">          &#125;</span><br><span class="line">          <span class="keyword">val</span> putSucceeded = memoryStore.putBytes(blockId, diskData.size, level.memoryMode, () =&gt; &#123;</span><br><span class="line">            <span class="comment">// https://issues.apache.org/jira/browse/SPARK-6076</span></span><br><span class="line">            <span class="comment">// If the file size is bigger than the free memory, OOM will happen. So if we</span></span><br><span class="line">            <span class="comment">// cannot put it into MemoryStore, copyForMemory should not be created. That&#x27;s why</span></span><br><span class="line">            <span class="comment">// this action is put into a `() =&gt; ChunkedByteBuffer` and created lazily.</span></span><br><span class="line">            diskData.toChunkedByteBuffer(allocator)</span><br><span class="line">          &#125;)</span><br><span class="line">          <span class="keyword">if</span> (putSucceeded) &#123;</span><br><span class="line">            diskData.dispose()</span><br><span class="line">            <span class="type">Some</span>(memoryStore.getBytes(blockId).get)</span><br><span class="line">          &#125; <span class="keyword">else</span> &#123;</span><br><span class="line">            <span class="type">None</span></span><br><span class="line">          &#125;</span><br><span class="line">        &#125;</span><br><span class="line">      &#125;</span><br><span class="line">    &#125; <span class="keyword">else</span> &#123;</span><br><span class="line">      <span class="type">None</span></span><br><span class="line">    &#125;</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * Attempts to cache spilled values read from disk into the MemoryStore in order to speed up</span></span><br><span class="line"><span class="comment">   * subsequent reads. This method requires the caller to hold a read lock on the block.</span></span><br><span class="line"><span class="comment">   *</span></span><br><span class="line"><span class="comment">   * @return a copy of the iterator. The original iterator passed this method should no longer</span></span><br><span class="line"><span class="comment">   *         be used after this method returns.</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="keyword">private</span> <span class="function"><span class="keyword">def</span> <span class="title">maybeCacheDiskValuesInMemory</span></span>[<span class="type">T</span>](</span><br><span class="line">      blockInfo: <span class="type">BlockInfo</span>,</span><br><span class="line">      blockId: <span class="type">BlockId</span>,</span><br><span class="line">      level: <span class="type">StorageLevel</span>,</span><br><span class="line">      diskIterator: <span class="type">Iterator</span>[<span class="type">T</span>]): <span class="type">Iterator</span>[<span class="type">T</span>] = &#123;</span><br><span class="line">    require(level.deserialized)</span><br><span class="line">    <span class="keyword">val</span> classTag = blockInfo.classTag.asInstanceOf[<span class="type">ClassTag</span>[<span class="type">T</span>]]</span><br><span class="line">    <span class="keyword">if</span> (level.useMemory) &#123;</span><br><span class="line">      <span class="comment">// Synchronize on blockInfo to guard against a race condition where two readers both try to</span></span><br><span class="line">      <span class="comment">// put values read from disk into the MemoryStore.</span></span><br><span class="line">      blockInfo.synchronized &#123;</span><br><span class="line">        <span class="keyword">if</span> (memoryStore.contains(blockId)) &#123;</span><br><span class="line">          <span class="comment">// Note: if we had a means to discard the disk iterator, we would do that here.</span></span><br><span class="line">          memoryStore.getValues(blockId).get</span><br><span class="line">        &#125; <span class="keyword">else</span> &#123;</span><br><span class="line">          memoryStore.putIteratorAsValues(blockId, diskIterator, classTag) <span class="keyword">match</span> &#123;</span><br><span class="line">            <span class="keyword">case</span> <span class="type">Left</span>(iter) =&gt;</span><br><span class="line">              <span class="comment">// The memory store put() failed, so it returned the iterator back to us:</span></span><br><span class="line">              iter</span><br><span class="line">            <span class="keyword">case</span> <span class="type">Right</span>(_) =&gt;</span><br><span class="line">              <span class="comment">// The put() succeeded, so we can read the values back:</span></span><br><span class="line">              memoryStore.getValues(blockId).get</span><br><span class="line">          &#125;</span><br><span class="line">        &#125;</span><br><span class="line">      &#125;.asInstanceOf[<span class="type">Iterator</span>[<span class="type">T</span>]]</span><br><span class="line">    &#125; <span class="keyword">else</span> &#123;</span><br><span class="line">      diskIterator</span><br><span class="line">    &#125;</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * Get peer block managers in the system.</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="keyword">private</span> <span class="function"><span class="keyword">def</span> <span class="title">getPeers</span></span>(forceFetch: <span class="type">Boolean</span>): <span class="type">Seq</span>[<span class="type">BlockManagerId</span>] = &#123;</span><br><span class="line">    peerFetchLock.synchronized &#123;</span><br><span class="line">      <span class="keyword">val</span> cachedPeersTtl = conf.get(config.<span class="type">STORAGE_CACHED_PEERS_TTL</span>) <span class="comment">// milliseconds</span></span><br><span class="line">      <span class="keyword">val</span> diff = <span class="type">TimeUnit</span>.<span class="type">NANOSECONDS</span>.toMillis(<span class="type">System</span>.nanoTime() - lastPeerFetchTimeNs)</span><br><span class="line">      <span class="keyword">val</span> timeout = diff &gt; cachedPeersTtl</span><br><span class="line">      <span class="keyword">if</span> (cachedPeers == <span class="literal">null</span> || forceFetch || timeout) &#123;</span><br><span class="line">        cachedPeers = master.getPeers(blockManagerId).sortBy(_.hashCode)</span><br><span class="line">        lastPeerFetchTimeNs = <span class="type">System</span>.nanoTime()</span><br><span class="line">        logDebug(<span class="string">&quot;Fetched peers from master: &quot;</span> + cachedPeers.mkString(<span class="string">&quot;[&quot;</span>, <span class="string">&quot;,&quot;</span>, <span class="string">&quot;]&quot;</span>))</span><br><span class="line">      &#125;</span><br><span class="line">      cachedPeers</span><br><span class="line">    &#125;</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * Called for pro-active replenishment of blocks lost due to executor failures</span></span><br><span class="line"><span class="comment">   *</span></span><br><span class="line"><span class="comment">   * @param blockId blockId being replicate</span></span><br><span class="line"><span class="comment">   * @param existingReplicas existing block managers that have a replica</span></span><br><span class="line"><span class="comment">   * @param maxReplicas maximum replicas needed</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="function"><span class="keyword">def</span> <span class="title">replicateBlock</span></span>(</span><br><span class="line">      blockId: <span class="type">BlockId</span>,</span><br><span class="line">      existingReplicas: <span class="type">Set</span>[<span class="type">BlockManagerId</span>],</span><br><span class="line">      maxReplicas: <span class="type">Int</span>): <span class="type">Unit</span> = &#123;</span><br><span class="line">    logInfo(<span class="string">s&quot;Using <span class="subst">$blockManagerId</span> to pro-actively replicate <span class="subst">$blockId</span>&quot;</span>)</span><br><span class="line">    blockInfoManager.lockForReading(blockId).foreach &#123; info =&gt;</span><br><span class="line">      <span class="keyword">val</span> data = doGetLocalBytes(blockId, info)</span><br><span class="line">      <span class="keyword">val</span> storageLevel = <span class="type">StorageLevel</span>(</span><br><span class="line">        useDisk = info.level.useDisk,</span><br><span class="line">        useMemory = info.level.useMemory,</span><br><span class="line">        useOffHeap = info.level.useOffHeap,</span><br><span class="line">        deserialized = info.level.deserialized,</span><br><span class="line">        replication = maxReplicas)</span><br><span class="line">      <span class="comment">// we know we are called as a result of an executor removal, so we refresh peer cache</span></span><br><span class="line">      <span class="comment">// this way, we won&#x27;t try to replicate to a missing executor with a stale reference</span></span><br><span class="line">      getPeers(forceFetch = <span class="literal">true</span>)</span><br><span class="line">      <span class="keyword">try</span> &#123;</span><br><span class="line">        replicate(blockId, data, storageLevel, info.classTag, existingReplicas)</span><br><span class="line">      &#125; <span class="keyword">finally</span> &#123;</span><br><span class="line">        logDebug(<span class="string">s&quot;Releasing lock for <span class="subst">$blockId</span>&quot;</span>)</span><br><span class="line">        releaseLockAndDispose(blockId, data)</span><br><span class="line">      &#125;</span><br><span class="line">    &#125;</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * Replicate block to another node. Note that this is a blocking call that returns after</span></span><br><span class="line"><span class="comment">   * the block has been replicated.</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="keyword">private</span> <span class="function"><span class="keyword">def</span> <span class="title">replicate</span></span>(</span><br><span class="line">      blockId: <span class="type">BlockId</span>,</span><br><span class="line">      data: <span class="type">BlockData</span>,</span><br><span class="line">      level: <span class="type">StorageLevel</span>,</span><br><span class="line">      classTag: <span class="type">ClassTag</span>[_],</span><br><span class="line">      existingReplicas: <span class="type">Set</span>[<span class="type">BlockManagerId</span>] = <span class="type">Set</span>.empty): <span class="type">Unit</span> = &#123;</span><br><span class="line"></span><br><span class="line">    <span class="keyword">val</span> maxReplicationFailures = conf.get(config.<span class="type">STORAGE_MAX_REPLICATION_FAILURE</span>)</span><br><span class="line">    <span class="keyword">val</span> tLevel = <span class="type">StorageLevel</span>(</span><br><span class="line">      useDisk = level.useDisk,</span><br><span class="line">      useMemory = level.useMemory,</span><br><span class="line">      useOffHeap = level.useOffHeap,</span><br><span class="line">      deserialized = level.deserialized,</span><br><span class="line">      replication = <span class="number">1</span>)</span><br><span class="line"></span><br><span class="line">    <span class="keyword">val</span> numPeersToReplicateTo = level.replication - <span class="number">1</span></span><br><span class="line">    <span class="keyword">val</span> startTime = <span class="type">System</span>.nanoTime</span><br><span class="line"></span><br><span class="line">    <span class="keyword">val</span> peersReplicatedTo = mutable.<span class="type">HashSet</span>.empty ++ existingReplicas</span><br><span class="line">    <span class="keyword">val</span> peersFailedToReplicateTo = mutable.<span class="type">HashSet</span>.empty[<span class="type">BlockManagerId</span>]</span><br><span class="line">    <span class="keyword">var</span> numFailures = <span class="number">0</span></span><br><span class="line"></span><br><span class="line">    <span class="keyword">val</span> initialPeers = getPeers(<span class="literal">false</span>).filterNot(existingReplicas.contains)</span><br><span class="line"></span><br><span class="line">    <span class="keyword">var</span> peersForReplication = blockReplicationPolicy.prioritize(</span><br><span class="line">      blockManagerId,</span><br><span class="line">      initialPeers,</span><br><span class="line">      peersReplicatedTo,</span><br><span class="line">      blockId,</span><br><span class="line">      numPeersToReplicateTo)</span><br><span class="line"></span><br><span class="line">    <span class="keyword">while</span>(numFailures &lt;= maxReplicationFailures &amp;&amp;</span><br><span class="line">      !peersForReplication.isEmpty &amp;&amp;</span><br><span class="line">      peersReplicatedTo.size &lt; numPeersToReplicateTo) &#123;</span><br><span class="line">      <span class="keyword">val</span> peer = peersForReplication.head</span><br><span class="line">      <span class="keyword">try</span> &#123;</span><br><span class="line">        <span class="keyword">val</span> onePeerStartTime = <span class="type">System</span>.nanoTime</span><br><span class="line">        logTrace(<span class="string">s&quot;Trying to replicate <span class="subst">$blockId</span> of <span class="subst">$&#123;data.size&#125;</span> bytes to <span class="subst">$peer</span>&quot;</span>)</span><br><span class="line">        <span class="comment">// This thread keeps a lock on the block, so we do not want the netty thread to unlock</span></span><br><span class="line">        <span class="comment">// block when it finishes sending the message.</span></span><br><span class="line">        <span class="keyword">val</span> buffer = <span class="keyword">new</span> <span class="type">BlockManagerManagedBuffer</span>(blockInfoManager, blockId, data, <span class="literal">false</span>,</span><br><span class="line">          unlockOnDeallocate = <span class="literal">false</span>)</span><br><span class="line">        blockTransferService.uploadBlockSync(</span><br><span class="line">          peer.host,</span><br><span class="line">          peer.port,</span><br><span class="line">          peer.executorId,</span><br><span class="line">          blockId,</span><br><span class="line">          buffer,</span><br><span class="line">          tLevel,</span><br><span class="line">          classTag)</span><br><span class="line">        logTrace(<span class="string">s&quot;Replicated <span class="subst">$blockId</span> of <span class="subst">$&#123;data.size&#125;</span> bytes to <span class="subst">$peer</span>&quot;</span> +</span><br><span class="line">          <span class="string">s&quot; in <span class="subst">$&#123;(System.nanoTime - onePeerStartTime).toDouble / 1e6&#125;</span> ms&quot;</span>)</span><br><span class="line">        peersForReplication = peersForReplication.tail</span><br><span class="line">        peersReplicatedTo += peer</span><br><span class="line">      &#125; <span class="keyword">catch</span> &#123;</span><br><span class="line">        <span class="keyword">case</span> <span class="type">NonFatal</span>(e) =&gt;</span><br><span class="line">          logWarning(<span class="string">s&quot;Failed to replicate <span class="subst">$blockId</span> to <span class="subst">$peer</span>, failure #<span class="subst">$numFailures</span>&quot;</span>, e)</span><br><span class="line">          peersFailedToReplicateTo += peer</span><br><span class="line">          <span class="comment">// we have a failed replication, so we get the list of peers again</span></span><br><span class="line">          <span class="comment">// we don&#x27;t want peers we have already replicated to and the ones that</span></span><br><span class="line">          <span class="comment">// have failed previously</span></span><br><span class="line">          <span class="keyword">val</span> filteredPeers = getPeers(<span class="literal">true</span>).filter &#123; p =&gt;</span><br><span class="line">            !peersFailedToReplicateTo.contains(p) &amp;&amp; !peersReplicatedTo.contains(p)</span><br><span class="line">          &#125;</span><br><span class="line"></span><br><span class="line">          numFailures += <span class="number">1</span></span><br><span class="line">          peersForReplication = blockReplicationPolicy.prioritize(</span><br><span class="line">            blockManagerId,</span><br><span class="line">            filteredPeers,</span><br><span class="line">            peersReplicatedTo,</span><br><span class="line">            blockId,</span><br><span class="line">            numPeersToReplicateTo - peersReplicatedTo.size)</span><br><span class="line">      &#125;</span><br><span class="line">    &#125;</span><br><span class="line">    logDebug(<span class="string">s&quot;Replicating <span class="subst">$blockId</span> of <span class="subst">$&#123;data.size&#125;</span> bytes to &quot;</span> +</span><br><span class="line">      <span class="string">s&quot;<span class="subst">$&#123;peersReplicatedTo.size&#125;</span> peer(s) took <span class="subst">$&#123;(System.nanoTime - startTime) / 1e6&#125;</span> ms&quot;</span>)</span><br><span class="line">    <span class="keyword">if</span> (peersReplicatedTo.size &lt; numPeersToReplicateTo) &#123;</span><br><span class="line">      logWarning(<span class="string">s&quot;Block <span class="subst">$blockId</span> replicated to only &quot;</span> +</span><br><span class="line">        <span class="string">s&quot;<span class="subst">$&#123;peersReplicatedTo.size&#125;</span> peer(s) instead of <span class="subst">$numPeersToReplicateTo</span> peers&quot;</span>)</span><br><span class="line">    &#125;</span><br><span class="line"></span><br><span class="line">    logDebug(<span class="string">s&quot;block <span class="subst">$blockId</span> replicated to <span class="subst">$&#123;peersReplicatedTo.mkString(&quot;, &quot;)&#125;</span>&quot;</span>)</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * Read a block consisting of a single object.</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="function"><span class="keyword">def</span> <span class="title">getSingle</span></span>[<span class="type">T</span>: <span class="type">ClassTag</span>](blockId: <span class="type">BlockId</span>): <span class="type">Option</span>[<span class="type">T</span>] = &#123;</span><br><span class="line">    get[<span class="type">T</span>](blockId).map(_.data.next().asInstanceOf[<span class="type">T</span>])</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * Write a block consisting of a single object.</span></span><br><span class="line"><span class="comment">   *</span></span><br><span class="line"><span class="comment">   * @return true if the block was stored or false if the block was already stored or an</span></span><br><span class="line"><span class="comment">   *         error occurred.</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="function"><span class="keyword">def</span> <span class="title">putSingle</span></span>[<span class="type">T</span>: <span class="type">ClassTag</span>](</span><br><span class="line">      blockId: <span class="type">BlockId</span>,</span><br><span class="line">      value: <span class="type">T</span>,</span><br><span class="line">      level: <span class="type">StorageLevel</span>,</span><br><span class="line">      tellMaster: <span class="type">Boolean</span> = <span class="literal">true</span>): <span class="type">Boolean</span> = &#123;</span><br><span class="line">    putIterator(blockId, <span class="type">Iterator</span>(value), level, tellMaster)</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="comment">/**</span></span><br><span class="line"><span class="comment">   * Drop a block from memory, possibly putting it on disk if applicable. Called when the memory</span></span><br><span class="line"><span class="comment">   * store reaches its limit and needs to free up space.</span></span><br><span class="line"><span class="comment">   *</span></span><br><span class="line"><span class="comment">   * If `data` is not put on disk, it won&#x27;t be created.</span></span><br><span class="line"><span class="comment">   *</span></span><br><span class="line"><span class="comment">   * The caller of this method must hold a write lock on the block before calling this method.</span></span><br><span class="line"><span class="comment">   * This method does not release the write lock.</span></span><br><span class="line"><span class="comment">   *</span></span><br><span class="line"><span class="comment">   * @return the block&#x27;s new effective StorageLevel.</span></span><br><span class="line"><span class="comment">   */</span></span><br><span class="line">  <span class="keyword">private</span>[storage] <span class="keyword">override</span> <span class="function"><span class="keyword">def</span> <span class="title">dropFromMemory</span></span>[<span class="type">T</span>: <span class="type">ClassTag</span>](</span><br><span class="line">      blockId: <span class="type">BlockId</span>,</span><br><span class="line">      data: () =&gt; <span class="type">Either</span>[<span class="type">Array</span>[<span class="type">T</span>], <span class="type">ChunkedByteBuffer</span>]): <span class="type">StorageLevel</span> = &#123;</span><br><span class="line">    logInfo(<span class="string">s&quot;Dropping block <span class="subst">$blockId</span> from memory&quot;</span>)</span><br><span class="line">    <span cla
