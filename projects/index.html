<script>
const LANG_COLORS={JavaScript:'#f1e05a',TypeScript:'#3178c6',Python:'#3572A5',Java:'#b07219','C++':'#f34b7d',C:'#555555','C#':'#178600',Go:'#00ADD8',Rust:'#dea584',Shell:'#89e051',HTML:'#e34c26',CSS:'#563d7c',Vue:'#41b883',Ruby:'#701516',PHP:'#4F5D95',Kotlin:'#A97BFF',Swift:'#F05138',Scala:'#c22d40',Jupyter_Notebook:'#DA5B0B'};
function langColor(l){return LANG_COLORS[l&&l.replace(/ /g,'_')]||'#ccc'}
function timeAgo(d){const s=Math.floor((Date.now()-new Date(d))/1000);if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';if(s<2592000)return Math.floor(s/86400)+'d ago';if(s<31536000)return Math.floor(s/2592000)+'mo ago';return Math.floor(s/31536000)+'y ago'}
let allRepos=[];
async function loadRepos(){
  try{
    let page=1,repos=[];
    while(true){
      const r=await fetch(`https://api.github.com/users/iideas18/repos?per_page=100&sort=updated&page=${page}`);
      if(!r.ok)throw new Error(r.status);
      const d=await r.json();
      repos=repos.concat(d);
      if(d.length<100)break;
      page++;
    }
    allRepos=repos;
    renderStats(repos);
    renderLangFilters(repos);
    renderRepos(repos);
  }catch(e){
    document.getElementById('pj-grid').innerHTML='<div class="pj-loading" style="color:#e53935"><i class="fas fa-exclamation-triangle"></i>&nbsp;Failed to load repositories. GitHub API rate limit may be exceeded.</div>';
  }
}
function renderStats(repos){
  const langs=[...new Set(repos.map(r=>r.language).filter(Boolean))];
  const stars=repos.reduce((a,r)=>a+r.stargazers_count,0);
  const forks=repos.reduce((a,r)=>a+r.forks_count,0);
  document.getElementById('pj-stats').innerHTML=`
    <div class="pj-stat"><span class="num">${repos.length}</span><span class="lbl">Repositories</span></div>
    <div class="pj-stat"><span class="num">${stars}</span><span class="lbl">Total Stars</span></div>
    <div class="pj-stat"><span class="num">${forks}</span><span class="lbl">Total Forks</span></div>
    <div class="pj-stat"><span class="num">${langs.length}</span><span class="lbl">Languages</span></div>`;
}
function renderLangFilters(repos){
  const cnt={};repos.forEach(r=>{if(r.language)cnt[r.language]=(cnt[r.language]||0)+1});
  const sorted=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const el=document.getElementById('lang-filters');
  el.innerHTML='<button class="lang-btn active" data-lang="" onclick="setLang(this,\'\')">All</button>'+
    sorted.map(([l,n])=>`<button class="lang-btn" data-lang="${l}" onclick="setLang(this,'${l}')" style="border-color:${langColor(l)}">${l} <span style="opacity:.6">${n}</span></button>`).join('');
}
let activeLang='';
function setLang(btn,lang){activeLang=lang;document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b===btn));filterRepos()}
function filterRepos(){
  const q=document.getElementById('pj-search').value.toLowerCase();
  const filtered=allRepos.filter(r=>{
    const matchLang=!activeLang||r.language===activeLang;
    const matchQ=!q||r.name.toLowerCase().includes(q)||(r.description||'').toLowerCase().includes(q);
    return matchLang&&matchQ;
  });
  renderRepos(filtered);
}
function renderRepos(repos){
  const grid=document.getElementById('pj-grid');
  if(!repos.length){grid.innerHTML='';document.getElementById('pj-empty').style.display='block';return}
  document.getElementById('pj-empty').style.display='none';
  grid.innerHTML=repos.map(r=>`
    <div class="pj-card">
      <a class="pj-card-name" href="${r.html_url}" target="_blank" rel="noopener">
        <i class="fas fa-${r.fork?'code-branch':'book'}" style="font-size:.8rem;opacity:.6;margin-right:4px"></i>${r.name}
        ${r.fork?'<span class="pj-fork-badge">fork</span>':''}
        ${r.archived?'<span class="pj-archived">archived</span>':''}
      </a>
      <p class="pj-card-desc">${r.description||'<em style="color:#bbb">No description</em>'}</p>
      <div class="pj-card-meta">
        ${r.language?`<span class="pj-lang"><span class="lang-dot" style="background:${langColor(r.language)}"></span>${r.language}</span>`:''}
        <span class="pj-card-stars"><i class="fas fa-star" style="color:#f4b400;font-size:.8rem"></i>&nbsp;${r.stargazers_count}</span>
        <span class="pj-card-forks"><i class="fas fa-code-branch" style="font-size:.8rem;opacity:.5"></i>&nbsp;${r.forks_count}</span>
        <span class="pj-card-updated">${timeAgo(r.pushed_at)}</span>
      </div>
    </div>`).join('');
}
loadRepos();
